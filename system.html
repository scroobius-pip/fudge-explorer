<title>Fudge — System</title>
<style>
  :root { --ink:#111; --mut:#8a8a8a; --line:#e8e8e8; --soft:#f6f6f6; }

  }
  header {

  .htop { display:flex; align-items:baseline; gap:16px; padding:13px 40px 7px; flex-wrap:wrap; }

  .title span { color:var(--mut); font-weight:400; }
  .meta { font-size:10px; color:var(--mut); letter-spacing:.05em; font-variant-numeric:tabular-nums; }
  .mini { display:flex; gap:0; padding:0 40px 8px; overflow-x:auto; }
  .mini button {
    font:inherit; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:#b9b9b9; background:none; border:none; cursor:pointer;
    padding:5px 10px 4px; border-bottom:1px solid transparent; white-space:nowrap;
  }
  .mini button::before { content:"· "; color:#d5d5d5; }
  .mini button:hover { color:var(--ink); }
  .mini button.act { color:var(--ink); border-bottom-color:var(--ink); }
  .search {
    margin:0 40px 12px; width:calc(100% - 80px); max-width:320px;
    font:inherit; font-size:12px; color:var(--ink);
    border:none; border-bottom:1px solid #ccc; padding:3px 0; outline:none; background:transparent;
  }
  .search::placeholder { color:#b9b9b9; }
  .search:focus { border-bottom-color:var(--ink); }
  #flow { max-width:780px; margin:0 auto; padding: 24px 40px 90px; }
  .stage { display:grid; grid-template-columns:36px 1fr; scroll-margin-top:100px; }
  .rail { position:relative; }
  .rail::before, .rail::after { content:""; position:absolute; left:10px; width:1px; background:var(--line); }
  .rail::before { top:0; bottom:50%; }
  .rail::after { top:50%; bottom:0; }
  .stage:first-of-type .rail::before, .stage:last-of-type .rail::after { display:none; }
  .dot {
    position:absolute; left:6px; top:10px; width:9px; height:9px; border-radius:50%;
    background:#fff; border:1px solid #c9c9c9; z-index:1;
  }
  .stage.here .dot { background:var(--ink); border-color:var(--ink); }
  .body { padding: 8px 0 12px 12px; min-width:0; }
  h2 {
    font-size:11px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; margin:0;
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  h2 .idx { color:#b9b9b9; font-weight:500; }
  h2 .cnt { font-size:10px; color:var(--mut); letter-spacing:.05em; text-transform:none; }
  .desc { font-size:11px; color:var(--mut); margin:3px 0 12px; }
  .rows { border-top:1px solid var(--line); }
  .row {
    display:flex; align-items:baseline; gap:12px;
    width:100%; text-align:left; font:inherit; font-size:12.5px; color:var(--ink);
    background:none; border:none; border-bottom:1px solid var(--line);
    padding:5px 4px; cursor:pointer;
  }
  .row:hover { background:var(--soft); }
  .row .l { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .n { font-size:10.5px; color:var(--mut); font-variant-numeric:tabular-nums; letter-spacing:.02em; flex:0 0 auto; }
  .row.zero .n { color:#c4c4c4; }
  .row .car { font-size:11px; color:#c4c4c4; flex:0 0 auto; transition:transform .15s; }
  .row.open .car { transform:rotate(45deg); color:var(--ink); }
  .row.dim { opacity:.13; }
  .row.hit { font-weight:600; }
  .glabel {
    font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#b9b9b9;
    padding:12px 4px 3px;
  }
  .panel { display:none; padding:12px 4px 14px; border-bottom:1px solid var(--line); }
  .panel.show { display:block; }
  .pnote { font-size:10.5px; color:#b9b9b9; margin:0 0 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip {
    display:inline-flex; align-items:baseline; gap:6px;
    font:inherit; font-size:11px; color:#444;
    border:1px solid var(--line); border-radius:99px; background:#fff;
    padding:2px 10px; cursor:pointer; white-space:nowrap;
  }
  .chip:hover { border-color:#bbb; color:var(--ink); background:var(--soft); }
  .chip .n { font-size:9.5px; color:#b9b9b9; font-variant-numeric:tabular-nums; }
  .chip.open { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip.open .n { color:#bbb; }
  .chip.dim { opacity:.13; }
  .chip.hit { font-weight:600; }
  .chipgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
  @media (max-width:720px) { .chipgrid { grid-template-columns:repeat(2, 1fr); } }
  .subrow {
    display:flex; align-items:baseline; gap:10px;
    width:100%; text-align:left; font:inherit; font-size:11.5px; color:var(--ink);
    background:none; border:none; border-bottom:1px solid var(--line);
    padding:4px 4px; cursor:pointer;
  }
  .subrow:hover { background:var(--soft); }
  .subrow .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .subrow .s { font-size:10px; color:var(--mut); flex:0 0 auto; }
  .subrow .car { font-size:10px; color:#c4c4c4; flex:0 0 auto; transition:transform .15s; }
  .subrow.open .car { transform:rotate(45deg); color:var(--ink); }
  .termrow { display:grid; grid-template-columns:1fr 210px; gap:12px; padding:4px 4px; font-size:11.5px; border-bottom:1px solid var(--line); }
  .termrow .tl { font-weight:500; }
  .termrow .td { font-size:11px; color:#666; line-height:1.5; }
  .termrow .tid { font-size:9.5px; color:#b9b9b9; font-family:ui-monospace, Menlo, monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; grid-column:1 / -1; }
  @media (max-width:640px) { .termrow { grid-template-columns:1fr; } }
  .termrow.dim { opacity:.13; }
  .termrow.hit .tl { font-weight:600; }
  .kv { font-size:11.5px; }
  .kv .r { display:flex; gap:12px; padding:3px 0; }
  .kv .k { flex:0 0 104px; color:var(--mut); }
  .kv .v { flex:1; word-break:break-word; }
  .kv .v.mono { font-family:ui-monospace, Menlo, monospace; font-size:10px; }
  .swrow { display:flex; align-items:center; gap:10px; padding:4px 0; font-size:11.5px; }
  .swrow .sw { width:22px; height:22px; border:1px solid rgba(0,0,0,.08); border-radius:2px; }
  .swrow .t { flex:1; }
  .swrow .s { font-size:10px; color:var(--mut); font-variant-numeric:tabular-nums; }
  .confbar { height:3px; background:var(--soft); border-radius:99px; margin:2px 0 7px; }
  .confbar i { display:block; height:3px; background:var(--ink); border-radius:99px; }
  .empty { font-size:10.5px; color:#b9b9b9; padding:3px 0; }
  .flow {
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#b9b9b9;
    padding:0 0 8px 36px;
  }
  .flow::before, .flow::after { content:""; width:24px; height:1px; background:var(--line); }
  .flow code { font-family:inherit; color:#a0a0a0; }
  footer {
    padding:16px 40px 30px; font-size:10.5px; color:var(--mut); letter-spacing:.04em;
    border-top:1px solid var(--line);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  footer a { color:var(--ink); text-decoration:none; border-bottom:1px solid #ccc; }
  footer a:hover { border-bottom-color:var(--ink); }
  a.ext { color:var(--ink); text-decoration:none; border-bottom:1px solid #ccc; font-size:11px; }
  a.ext:hover { border-bottom-color:var(--ink); }
  @media (max-width:640px) { .htop,.mini,.search,#flow,footer { padding-left:20px; padding-right:20px; } }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(ms){ return new Date(ms).toISOString().slice(0,16).replace("T"," ") + " UTC"; }

function row(label, n, panelHtml, opts={}) {
  const b = document.createElement("button");
  b.className = "row" + (opts.zero ? " zero" : "");
  b.dataset.name = label.toLowerCase();
  b.innerHTML = '<span class="l">' + esc(label) + '</span>' +
    (n !== null && n !== undefined ? '<span class="n">' + n.toLocaleString() + "</span>" : "") +
    '<span class="car">+</span>';
  b.setAttribute("data-exp", "");
  const p = document.createElement("div");
  p.className = "panel";
  p.innerHTML = panelHtml;
  return [b, p];
}

function group(label) {
  const g = document.createElement("div");
  g.className = "glabel";
  g.textContent = label;
  return g;
}

function chip(label, n, panelHtml, opts={}) {
  const c = document.createElement("button");
  c.className = "chip" + (opts.open ? " open" : "");
  c.dataset.name = (opts.name || label).toLowerCase();
  c.innerHTML = '<span>' + esc(label) + '</span>' + (n !== null && n !== undefined ? '<span class="n">' + n + "</span>" : "");
  c.setAttribute("data-exp", "");
  const p = document.createElement("div");
  p.className = "panel";
  p.innerHTML = panelHtml;
  return [c, p];
}

function worldContent() {
  const wrap = document.createElement("div");
  const box = document.createElement("div");
  box.className = "chips";
  for (const [origin, n] of TOP_DOMAINS) {
    const caps = CAPTURES[origin];
    let panel = '<p class="pnote">' + esc(origin) + " · " + n + " captures</p>";
    if (caps) {
      panel += caps.map(c =>
        '<button class="subrow" data-exp><span class="t">' + esc(c[2]) + '</span><span class="s">' + esc(c[1]) + ' · ' + fmt(c[3]) + '</span><span class="car">+</span></button>' +
        '<div class="panel">' + capturePanel(c[0]) + "</div>"
      ).join("");
    } else {
      panel += '<div class="empty">captures exist for this domain but are not baked into this build — ask to add them.</div>';
    }
    const [c, p] = chip(origin.replace("https://",""), n, panel);
    box.appendChild(c); box.appendChild(p);
  }
  const [r, p] = row("domains", 1759, '<p class="pnote">normalized public web origin keyed by its semantic identity — top 20 by capture count above; click any domain to expand its captures.</p>');
  wrap.append(r, p, box);
  return wrap;
}

function capturePanel(id) {
  let origin = null, meta = null;
  for (const [o, caps] of Object.entries(CAPTURES)) {
    const f = caps.find(c => c[0] === id);
    if (f) { origin = o; meta = f; break; }
  }
  const deep = DEEP[id];
  let html = "";
  if (meta) {
    html += '<div class="kv">' +
      '<div class="r"><span class="k">capture_id</span><span class="v mono">' + id + "</span></div>" +
      '<div class="r"><span class="k">domain</span><span class="v">' + esc(origin) + "</span></div>" +
      '<div class="r"><span class="k">path</span><span class="v mono">' + esc(meta[1]) + "</span></div>" +
      '<div class="r"><span class="k">captured</span><span class="v mono">' + fmt(meta[3]) + "</span></div>" +
      '<div class="r"><span class="k">screenshot</span><span class="v"><a class="ext" href="https://pin.fontofweb.com/' + id + '" target="_blank">pin.fontofweb.com/' + id + " ↗</a></span></div>" +
      "</div>";
  }
  if (deep) {
    if (deep.color_roles.length) {
      html += '<div class="pnote" style="margin-top:10px">color roles</div>';
      html += deep.color_roles.map(c =>
        '<div class="swrow"><span class="sw" style="background:rgb(' + c[1] + "," + c[2] + "," + c[3] + ')"></span>' +
        '<span class="t">' + esc(c[0]) + '</span><span class="s">' + c[1] + "," + c[2] + "," + c[3] + " · " + c[4] + " occ</span></div>"
      ).join("");
    }
    if (deep.terms.length) {
      html += '<div class="pnote" style="margin-top:10px">resolved terms</div>';
      html += deep.terms.map(t =>
        '<div class="swrow"><span class="t">' + esc(TERMDATA[t[0]] ? TERMDATA[t[0]][0] : t[0]) + '</span><span class="s">' + Math.round(t[1]*100) + "%</span></div>" +
        '<div class="confbar"><i style="width:' + Math.round(t[1]*100) + '%"></i></div>'
      ).join("");
    }
    if (deep.empty.length) {
      html += '<div class="pnote" style="margin-top:10px">other observation families</div>';
      html += deep.empty.map(e => '<div class="empty">' + e + " — no rows at this grain for this capture</div>").join("");

    html += '<div class="empty" style="margin-top:8px">only identity is baked for this capture — ask to add its profile.</div>';

    capsHtml += '<div class="pnote" style="margin:6px 0 4px;color:#b9b9b9">' + esc(origin.replace("https://","")) + "</div>";
    capsHtml += caps.map(c =>
      '<button class="subrow" data-exp><span class="t">' + esc(c[2]) + '</span><span class="s">' + esc(c[1]) + ' · ' + fmt(c[3]) + '</span><span class="car">+</span></button>' +
      '<div class="panel">' + capturePanel(c[0]) + "</div>"
    ).join("");
  }
  const [r2, p2] = row("captures", 10735, capsHtml);
  wrap.append(r2, p2);
  const [r3, p3] = row("capture_set", 0, '<p class="pnote">captures intentionally related as states, viewports, or revisions.</p><div class="empty">0 rows at this grain.</div>', { zero:true });
  wrap.append(r3, p3);
  return wrap;
}

function measureStage() {
  const wrap = document.createElement("div");
  const groups = [
    ["type", [["text_style",42045],["type_role",948],["font_observation",1218]]],
    ["color", [["color_role",4360],["raster_palette",2514],["background_property",19156],["gradient",199]]],
    ["space & shape", [["spacing_observation",64219],["radius_observation",8748],["border_observation",88652],["shadow_observation",4484]]],
    ["structure & media", [["structure",400],["media",0]]],
    ["quality", [["composition",0],["profile_completeness",null]]]
  ];
  for (const [gname, items] of groups) {
    wrap.appendChild(group(gname));
    for (const [name, n] of items) {
      const obs = OBS.find(o => o[0] === name);
      const [r, p] = row(name, n, '<p class="pnote">' + esc(obs ? obs[1] : "") + "</p><div class=\"empty\">sample rows can be baked on request.</div>", { zero: n === 0 });
      wrap.append(r, p);
    }
  }
  return wrap;
}

function fontsStage() {
  const wrap = document.createElement("div");
  const [r, p] = row("families", 3257, '<p class="pnote">font families from the catalogue — click one for details</p>' +
    '<div class="chipgrid" style="margin-top:8px">' +
    FAMILIES.map(f =>
      '<button class="chip" data-exp style="justify-content:space-between"><span>' + esc(f[1]) + '</span><span class="n">' + esc(f[2]) + "</span></button>" +
      '<div class="panel"><div class="kv">' +
      '<div class="r"><span class="k">family_id</span><span class="v mono">' + f[0] + "</span></div>" +
      '<div class="r"><span class="k">name</span><span class="v">' + esc(f[1]) + "</span></div>" +
      '<div class="r"><span class="k">vendor</span><span class="v">' + esc(f[2]) + "</span></div>" +
      "</div><div class=\"empty\">releases not baked per family — ask to add them.</div></div>"
    ).join("") + "</div>"
  , { name:"families" });
  wrap.append(r, p);
  for (const [name, desc] of [["release","versioned font release from an authoritative source",1751],["designer","canonical designer identity"],["vendor","canonical vendor or foundry identity"]]) {
    const [rr, pp] = row(name, name === "release" ? 1751 : null, '<p class="pnote">' + desc + "</p>");
    wrap.append(rr, pp);
  }
  return wrap;
}

function enrichStage() {
  const wrap = document.createElement("div");
  wrap.appendChild(group("contracts"));
  for (const [name, desc] of ENRICH.slice(0, 3)) {
    const [r, p] = row(name, null, '<p class="pnote">' + esc(desc) + "</p>");
    wrap.append(r, p);
  }
  wrap.appendChild(group("projection & resolution"));
  for (const [name, desc, n] of ENRICH.slice(3)) {
    const [r, p] = row(name, n, '<p class="pnote">' + esc(desc) + "</p>");
    wrap.append(r, p);
  }
  return wrap;
}

function groundStage() {
  const wrap = document.createElement("div");
  const [r, p] = row("ontology_release", 2, '<p class="pnote">versioned Fudge ontology release and the digest of its checked-in registry — two active releases (1.0.0, 1.1.0).</p>');
  wrap.append(r, p);
  const grid = document.createElement("div");
  grid.className = "chipgrid";
  for (const [fid, flabel, card, n, fdef] of FACETS) {
    const terms = [];
    for (const tid in TERMDATA) {
      if (TERMDATA[tid][2] === fid) terms.push([tid, TERMDATA[tid][0], TERMDATA[tid][1]]);
    }
    const termHtml = '<div class="pnote">' + esc(fdef) + " · cardinality " + card + "</div>" +
      terms.map(t =>
        '<div class="termrow" data-name="' + esc(t[1].toLowerCase()) + '">' +
        '<span class="tl">' + esc(t[1]) + '</span><span class="tid">' + esc(t[0]) + "</span>" +
        '<span class="td" style="grid-column:1 / -1">' + esc(t[2]) + "</span></div>"
      ).join("");
    const [c, p] = chip(flabel, n, termHtml, { name: flabel });
    grid.appendChild(c); grid.appendChild(p);
  }
  wrap.append(grid);
  return wrap;
}

function serveStage() {
  const wrap = document.createElement("div");
  for (const [name, desc, n] of RETRIEVAL) {
    const [r, p] = row(name, n, '<p class="pnote">' + esc(desc) + "</p>");
    wrap.append(r, p);
  }
  return wrap;
}

/* --- assemble --- */

const builders = [worldContent, captureStage, measureStage, fontsStage, enrichStage, groundStage, serveStage];

STAGES.forEach((st, i) => {
  const sec = document.createElement("section");
  sec.className = "stage";
  sec.id = "st_" + st.id;
  sec.dataset.stage = st.name.toLowerCase();
  sec.innerHTML = '<div class="rail"><span class="dot"></span></div><div class="body">' +
    '<h2><span class="idx">' + st.idx + '</span> ' + st.name + ' <span class="cnt">' + st.cnt + "</span></h2>" +
    '<p class="desc">' + st.desc + "</p></div>";
  sec.querySelector(".body").appendChild(builders[i]());
  flow.appendChild(sec);
  if (st.flow) {
    const f = document.createElement("div");
    f.className = "flow";
    f.innerHTML = st.flow;
    flow.appendChild(f);
  }
  const mb = document.createElement("button");
  mb.textContent = st.name;
  mb.dataset.stage = st.name.toLowerCase();
  mb.addEventListener("click", () => document.getElementById("st_" + st.id).scrollIntoView({ behavior:"smooth" }));
  mini.appendChild(mb);
});

/* --- interactions --- */

document.addEventListener("click", e => {
  const b = e.target.closest("[data-exp]");
  if (!b) return;
  const p = b.nextElementSibling;
  if (!p || !p.classList.contains("panel")) return;
  p.classList.toggle("show");
  b.classList.toggle("open");
});

const miniBtns = new Map([...mini.children].map(b => [b.dataset.stage, b]));
const spy = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      document.querySelectorAll(".stage").forEach(s => s.classList.remove("here"));
      en.target.classList.add("here");
      miniBtns.forEach((b, k) => b.classList.toggle("act", k === en.target.dataset.stage));
    }
  });
}, { rootMargin:"-40% 0px -55% 0px" });
document.querySelectorAll(".stage").forEach(s => spy.observe(s));

const q = document.getElementById("q");
q.addEventListener("input", () => {
  const m = q.value.trim().toLowerCase();
  let hits = 0;
  document.querySelectorAll("[data-name]").forEach(el => {
    const hit = m && (el.dataset.name || "").includes(m);
    if (m && hit) hits++;
    el.classList.toggle("hit", m && hit);
    el.classList.toggle("dim", m && !hit);
    if (hit) {
      let cur = el.parentElement;
      while (cur) {
        if (cur.classList && cur.classList.contains("panel") && !cur.classList.contains("show")) {
          cur.classList.add("show");
          const trig = cur.previousElementSibling;
          if (trig && trig.classList.contains("open") === false) trig.classList.add("open");
        }
        cur = cur.parentElement;
      }
    }
  });
});
addEventListener("keydown", e => {
  if (e.key === "Escape" && document.activeElement === q) { q.value = ""; q.dispatchEvent(new Event("input")); q.blur(); }
});
</script>
