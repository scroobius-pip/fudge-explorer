name = "fudge-explorer-query-proxy"
main = "worker.js"
compatibility_date = "2026-07-26"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "explorer.withfudge.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[services]]
binding = "FUDGE_SERVICE"
service = "fudge-production"
entrypoint = "FudgeInternal"

[observability.logs]
enabled = true
