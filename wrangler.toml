name = "fudge-explorer-query-proxy"
main = "worker.js"
compatibility_date = "2026-07-26"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "explorer.withfudge.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[services]]
binding = "FUDGE_SERVICE"
service = "fudge-production"
entrypoint = "FudgeInternal"

[[unsafe.bindings]]
name = "SEMANTIC_TEXT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "SEMANTIC_IMAGE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 6, period = 60 }

[observability.logs]
enabled = true
