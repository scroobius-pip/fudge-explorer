  svg { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .edge { stroke:#ddd; stroke-width:1; }
  .edge.on { stroke:var(--ink); stroke-width:1.4; }
  .edge.off { opacity:.07; }
  .edge .lab { fill:#888; font-size:8.5px; letter-spacing:.02em; }
  .node { cursor:pointer; }
  .node circle { fill:#fff; stroke-width:1; }
  .node .ring { fill:none; stroke:#ccc; stroke-width:1; stroke-dasharray:2 2; opacity:0; }
  .node.exp .ring { opacity:1; }
  .node text { fill:var(--ink); font-size:10px; }
  .node .cap { text-transform:uppercase; font-size:8px; letter-spacing:.08em; }
  .node.off { opacity:.08; }
  .node.hit circle { stroke-width:2.5; }
  .node.hit text { font-weight:600; }
  .node.dim { opacity:.14; }
  .node.dragging circle { stroke-width:2; }
  .legend {
    position:absolute; left:24px; bottom:20px; z-index:10;
    display:flex; flex-direction:column; gap:4px;
    font-size:10px; color:#666;
    background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:4px;
    padding:9px 12px; cursor:default;

  .legend .sw { width:8px; height:8px; border-radius:50%; }
  .legend .li:hover { color:var(--ink); }
  .hint {
    position:absolute; right:24px; bottom:20px; z-index:10;
    font-size:10px; color:#b9b9b9; letter-spacing:.04em; text-align:right; line-height:1.7;
  }
  footer a { color:var(--ink); text-decoration:none; border-bottom:1px solid #ccc; }
  footer a:hover { border-bottom-color:var(--ink); }
  /* drawer */
  #shade { position:fixed; inset:0; background:rgba(17,17,17,.16); z-index:20; opacity:0; pointer-events:none; transition:opacity .18s; }
  #shade.on { opacity:1; pointer-events:auto; }
  #drawer {
    position:fixed; top:0; right:0; bottom:0; width:430px; max-width:94vw;
    background:#fff; border-left:1px solid var(--line); z-index:21;
    transform:translateX(103%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  #drawer.on { transform:none; }
  .dhead { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line); }
  .dback { font-size:10.5px; color:var(--mut); cursor:pointer; border:1px solid var(--line); border-radius:99px; padding:2px 11px; background:none; }
  .dback:hover { color:var(--ink); border-color:#bbb; }
  .dtitle { font-size:12px; font-weight:600; letter-spacing:.05em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dclose { margin-left:auto; font-size:13px; color:var(--mut); cursor:pointer; border:none; background:none; padding:4px 6px; }
  .dclose:hover { color:var(--ink); }
  .dbody { overflow-y:auto; padding:16px 20px 32px; }
  .dnote { font-size:11px; color:var(--mut); margin:0 0 16px; }
  .dsec { margin:0 0 20px; }
  .dsec h4 { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.16em; color:#b9b9b9; margin:0 0 8px; }
  .kv { border-top:1px solid var(--line); }
  .kv .r { display:flex; gap:12px; padding:5px 0; border-bottom:1px solid var(--line); font-size:11.5px; }
  .kv .k { flex:0 0 104px; color:var(--mut); }
  .kv .v { flex:1; word-break:break-word; }
  .kv .v.mono { font-family:ui-monospace, Menlo, monospace; font-size:10px; }
  .crow { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); cursor:pointer; font-size:11.5px; }
  .crow:hover { background:var(--soft); }
  .crow .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .s { font-size:10px; color:var(--mut); flex:0 0 auto; }
  .sw { flex:0 0 22px; height:22px; border:1px solid rgba(0,0,0,.08); border-radius:2px; }
  .bar { height:3px; background:var(--soft); border-radius:99px; margin:3px 0 8px; }
  .bar i { display:block; height:3px; background:var(--ink); border-radius:99px; }
  .empty { font-size:10.5px; color:#b9b9b9; padding:3px 0; }
  a.ext { color:var(--ink); text-decoration:none; border-bottom:1px solid #ccc; font-size:11px; }
  a.ext:hover { border-bottom-color:var(--ink); }
</style>

const TYPE_COLOR = {
  domain:"#111111", page:"#6b7280", capture:"#4263eb", obs:"#0ca678", enrich:"#7048e8",
  facet:"#b197fc", term:"#9775fa", family:"#e8590c", designer:"#f59f00", retrieval:"#c92a2a",
  color:"#1c7ed6", ontology:"#7048e8"
};

/* ================= graph model ================= */

const nodes = [], edges = [], nodeMap = {};
let alpha = 1;

function addNode(id, type, label, data={}) {
  if (nodeMap[id]) return nodeMap[id];
  const n = { id, type, label, data, x:0, y:0, vx:0, vy:0, expandable:false, deep:false };
  const p = { x: (Math.random()-.5)*400, y: (Math.random()-.5)*400 };
  n.x = p.x; n.y = p.y;
  nodeMap[id] = n; nodes.push(n);
  return n;
}
function addEdge(s, t, lab) {
  if (!edges.some(e => e.s === s && e.t === t)) edges.push({ s, t, lab });
}
function neighbors(id) {
  const set = new Set();
  for (const e of edges) { if (e.s === id) set.add(e.t); if (e.t === id) set.add(e.s); }
  return set;
}

/* ---------- build initial graph ---------- */

for (const [origin, n] of TOP_DOMAINS) {
  const d = addNode("d:" + origin, "domain", origin.replace("https://",""), { origin, captures: n });
  d.expandable = true; d.deep = true;
}
for (const origin of Object.keys(CAPTURES)) {
  const p = addNode("p:" + origin, "page", origin.replace("https://","") + "/" + (CAPTURES[origin][0][1] || ""), { origin });
  addEdge("d:" + origin, p.id, "hosts");
  for (const [cid, path, title, t] of CAPTURES[origin]) {
    const c = addNode("c:" + cid, "capture", title.replace(/\s*\|.*$/, ""), { id: cid, origin, path, title, captured_at: t });
    c.deep = !!DEEP[cid];
    addEdge(p.id, c.id, "captured");
  }
}
for (const [name, desc, n] of OBS) addNode("o:" + name, "obs", name, { desc, n });
addEdge("o:font_observation", "f:Inter", "resolves to");
for (const [name, desc, n] of ENRICH) addNode("e:" + name, "enrich", name, { desc, n });
addEdge("e:classification_contract", "e:classification_attempt", "runs");
addEdge("e:classification_attempt", "e:classification_state", "ends in");
addEdge("e:contextual_projection", "e:resolved_term", "contributes");
for (const [name, desc, n] of RETRIEVAL) addNode("r:" + name, "retrieval", name, { desc, n });
addEdge("r:embedding", "r:retrieval_generation", "partitioned into");
addEdge("r:retrieval_generation", "r:query_fudge", "serves");
for (const [id, name, vendor] of FAMILIES) {
  const f = addNode("f:" + name, "family", name, { id, vendor });
  f.expandable = true;
}
addNode("o:ontology", "ontology", "ontology_release", { desc:"versioned ontology release and registry digest", n:2 });
for (const [fid, flabel] of FACETS) {
  const fc = addNode("fac:" + fid, "facet", flabel, { fid });
  fc.expandable = true;
  addEdge("o:ontology", fc.id, "contains");
}
const deep = DEEP[8784];
for (const [t, conf] of deep.terms) {
  const tn = addNode("t:" + t, "term", TERMDATA[t] ? TERMDATA[t][0] : t, { t, conf });
  addEdge("c:8784", tn.id, "resolves");
  const facet = TERMDATA[t] ? TERMDATA[t][2] : null;
  if (facet) addEdge(tn.id, "fac:" + facet, "facet of");
}
for (const [role, r, g, b, occ] of deep.color_roles) {
  const cn = addNode("col:8784:" + role, "color", role, { role, r, g, b, occ });
  addEdge("c:8784", cn.id, "measured");
}

/* ---------- expansions ---------- */

function expand(n) {
  if (!n.expandable) return;
  n.expandable = false;
  if (n.type === "domain") {
    const caps = CAPTURES[n.data.origin];
    if (caps) {
      const p = nodeMap["p:" + n.data.origin];
      const shown = new Set();
      for (const [cid] of caps) shown.add("c:" + cid);
      const pn = p || addNode("p:" + n.data.origin, "page", n.data.origin.replace("https://",""), { origin: n.data.origin });
      if (!p) { addEdge(n.id, pn.id, "hosts"); }
      for (const [cid, path, title, t] of caps) {
        if (shown.has("c:" + cid)) continue;
        const c = addNode("c:" + cid, "capture", title.replace(/\s*\|.*$/, ""), { id: cid, origin: n.data.origin, path, title, captured_at: t });
        c.deep = !!DEEP[cid];
        addEdge(pn.id, c.id, "captured");
      }
    }
  }
  if (n.type === "facet") {
    const fid = n.data.fid;
    let count = 0;
    for (const tid in TERMDATA) {
      if (TERMDATA[tid][2] !== fid) continue;
      count++;
      const tn = addNode("t:" + tid, "term", TERMDATA[tid][0], { t: tid });
      addEdge(tn.id, n.id, "facet of");
      const cut = tid.lastIndexOf(".");
      if (cut > 0) {
        const parent = tid.slice(0, cut);
        if (TERMDATA[parent] && TERMDATA[parent][2] === fid) addEdge("t:" + parent, tn.id, "narrows");
      }
    }
  }
  if (n.type === "family") {
    addNode("dg:" + n.data.id, "designer", n.data.vendor, { role:"vendor" });
    addEdge(n.id, "dg:" + n.data.id, "sold by");
  }
  alpha = 1;
}

/* ---------- simulation ---------- */

const RE = 3400, SPRING = .012, GRAV = .0012, DAMP = .86;
function tick() {
  if (alpha > .01) {
    const L = edges.length ? 90 : 0;
    for (const a of nodes) {
      a.fx = 0; a.fy = 0;
      for (const b of nodes) {
        if (a === b) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx*dx + dy*dy + 1;
        const f = RE / d2;
        a.fx += dx / Math.sqrt(d2) * f; a.fy += dy / Math.sqrt(d2) * f;
      }
      a.fx -= a.x * GRAV; a.fy -= a.y * GRAV;
    }
    for (const e of edges) {
      const a = nodeMap[e.s], b = nodeMap[e.t];
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = (d - L) * SPRING * alpha;
      const ux = dx / d, uy = dy / d;
      a.fx += ux * f; a.fy += uy * f;
      b.fx -= ux * f; b.fy -= uy * f;
    }
    for (const a of nodes) {
      a.vx = (a.vx + a.fx) * DAMP; a.vy = (a.vy + a.fy) * DAMP;
      a.x += a.vx; a.y += a.vy;
      const m = 14; a.vx = Math.max(-m, Math.min(m, a.vx)); a.vy = Math.max(-m, Math.min(m, a.vy));
    }
    alpha *= .994;
  }
  render();
  requestAnimationFrame(tick);
}

/* ---------- rendering ---------- */

const svg = document.getElementById("svg");
const world = document.getElementById("world");
const NS = "http://www.w3.org/2000/svg";
const view = { tx: 0, ty: 0, z: 1 };
let hovered = null;

const edgeEls = new Map(), nodeEls = new Map(), labelEls = new Map();

function render() {
  world.setAttribute("transform", "translate(" + view.tx + " " + view.ty + ") scale(" + view.z + ")");
  for (const e of edges) {
    let g = edgeEls.get(e.s + "|" + e.t);
    const a = nodeMap[e.s], b = nodeMap[e.t];
    if (!a || !b) continue;
    if (!g) {
      g = document.createElementNS(NS, "path");
      g.setAttribute("class", "edge");
      const lab = document.createElementNS(NS, "text");
      lab.setAttribute("class", "lab");
      lab.textContent = e.lab;
      lab.style.display = "none";
      g.appendChild(lab);
      world.appendChild(g);
      edgeEls.set(e.s + "|" + e.t, g);
    }
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const ctrl = (b.x - a.x) * .5;
    g.setAttribute("d", "M " + a.x + " " + a.y + " C " + (a.x + ctrl) + " " + a.y + ", " + (b.x - ctrl) + " " + b.y + ", " + b.x + " " + b.y);
    const lab = g.querySelector("text");
    lab.setAttribute("x", mx); lab.setAttribute("y", my - 4);
  }
  for (const n of nodes) {
    let g = nodeEls.get(n.id);
    if (!g) {
      g = document.createElementNS(NS, "g");
      g.setAttribute("class", "node");
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("r", n.type === "domain" || n.type === "capture" || n.type === "facet" ? 5 : 4);
      const ring = document.createElementNS(NS, "circle");
      ring.setAttribute("r", 9);
      ring.setAttribute("class", "ring");
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", 9); t.setAttribute("y", 3.5);
      const cap = document.createElementNS(NS, "text");
      cap.setAttribute("x", 9); cap.setAttribute("y", 15);
      cap.setAttribute("class", "cap");
      g.append(ring, c, t, cap);
      world.appendChild(g);
      nodeEls.set(n.id, g);
      labelEls.set(n.id, [t, cap]);
      bindNode(g, n);
    }
    const c = g.querySelector("circle");
    c.setAttribute("fill", n.type === "color" ? ("rgb(" + n.data.r + "," + n.data.g + "," + n.data.b + ")") : "#fff");
    c.setAttribute("stroke", TYPE_COLOR[n.type] || "#111");
    const [t, cap] = labelEls.get(n.id);
    t.textContent = n.label;
    cap.textContent = n.type === "color" ? (n.data.r + "," + n.data.g + "," + n.data.b) : (n.deep ? "✦ " + n.label : n.label);
    cap.style.display = "none";
    const show = view.z > 1.25 || hovered === n.id || (hovered && (neighbors(hovered).has(n.id)));
    t.style.display = show ? "" : "none";
    cap.style.display = n.type === "color" ? (show ? "" : "none") : "none";
    g.setAttribute("transform", "translate(" + n.x + " " + n.y + ")");
  }
}

/* ---------- interactions ---------- */

let drag = null, moved = false, downAt = null;

function bindNode(g, n) {
  g.addEventListener("pointerdown", e => {
    e.stopPropagation();
    svg.setPointerCapture(e.pointerId);
    drag = { n, px: e.clientX, py: e.clientY };
    moved = false;
    downAt = { x: e.clientX, y: e.clientY };
  });
  g.addEventListener("pointermove", e => {
    if (drag && drag.n === n) {
      const dx = (e.clientX - drag.px), dy = (e.clientY - drag.py);
      if (Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y) > 4) moved = true;
      n.x += dx / view.z; n.y += dy / view.z;
      drag.px = e.clientX; drag.py = e.clientY;
      alpha = .6;
    }
  });
  g.addEventListener("pointerup", e => {
    if (drag && drag.n === n) {
      if (!moved) inspect(n);
      drag = null;
    }
  });
  g.addEventListener("pointerenter", () => { hovered = n.id; alpha = Math.max(alpha, .4); });
  g.addEventListener("pointerleave", () => { if (hovered === n.id) hovered = null; });
  g.addEventListener("dblclick", e => { e.stopPropagation(); expand(n); });
}

svg.addEventListener("pointerdown", e => {
  if (e.target === svg || e.target === world) {
    svg.setPointerCapture(e.pointerId);
    drag = { px: e.clientX, py: e.clientY, bg: true };
  }
});
svg.addEventListener("pointermove", e => {
  if (drag && drag.bg) {
    view.tx += e.clientX - drag.px; view.ty += e.clientY - drag.py;
    drag.px = e.clientX; drag.py = e.clientY;
  }
});
svg.addEventListener("pointerup", () => { drag = null; });
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * .0012);
  view.z = Math.max(.2, Math.min(4, view.z * f));
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left - view.tx, my = e.clientY - rect.top - view.ty;
  view.tx += mx * (1 - f); view.ty += my * (1 - f);
}, { passive:false });

setInterval(() => {
  if (!hovered) return;
  const nb = neighbors(hovered);
  for (const e of edges) {
    const g = edgeEls.get(e.s + "|" + e.t);
    if (!g) continue;
    const on = e.s === hovered || e.t === hovered;
    g.classList.toggle("on", on);
    g.classList.toggle("off", !on);
    const lab = g.querySelector("text");
    lab.style.display = on && view.z > .8 ? "" : "none";
    if (on && lab.style.display !== "none") {
      const a = nodeMap[e.s], b = nodeMap[e.t];
      const labx = (a.x + b.x) / 2, laby = (a.y + b.y) / 2 - 4;
      lab.setAttribute("x", labx); lab.setAttribute("y", laby);
    }
  }
  for (const n of nodes) {
    const el = nodeEls.get(n.id);
    if (!el) continue;
    const on = n.id === hovered || nb.has(n.id);
    el.classList.toggle("off", !on);
  }
}, 60);
setInterval(() => {
  if (hovered) return;
  for (const e of edges) { const g = edgeEls.get(e.s + "|" + e.t); if (g) { g.classList.remove("on","off"); g.querySelector("text").style.display = "none"; } }
  for (const n of nodes) { const el = nodeEls.get(n.id); if (el) el.classList.remove("off"); }
}, 80);

/* ---------- legend & search ---------- */

const LEGEND = [["domain","domain"],["page","page"],["capture","capture"],["obs","observation"],["enrich","enrichment"],
  ["facet","facet"],["term","term"],["family","font family"],["color","color role"],["retrieval","retrieval"]];
const legendEl = document.getElementById("legend");
legendEl.innerHTML = LEGEND.map(([t, l]) =>
  '<div class="li" data-type="' + t + '"><span class="sw" style="background:' + TYPE_COLOR[t] + '"></span>' + l + "</div>"
).join("");
let typeFilter = null;
legendEl.addEventListener("click", e => {
  const li = e.target.closest(".li");
  if (!li) return;
  const t = li.dataset.type;
  typeFilter = typeFilter === t ? null : t;
  for (const el of legendEl.children) el.style.opacity = typeFilter && el.dataset.type !== typeFilter ? ".4" : "1";
});

const q = document.getElementById("q");
q.addEventListener("input", () => {
  const m = q.value.trim().toLowerCase();
  let first = null;
  for (const n of nodes) {
    const el = nodeEls.get(n.id);
    if (!el) continue;
    const hit = m && (n.label.toLowerCase().includes(m) || (n.type === "term" && n.data.t.includes(m)));
    const typeHit = !typeFilter || n.type === typeFilter;
    el.classList.toggle("hit", !!hit);
    el.classList.toggle("dim", (m && !hit) || !typeHit);
    if (hit && !first) first = n;
  }
  if (first) {
    view.tx = -first.x * view.z + innerWidth / 2;
    view.ty = -first.y * view.z + innerHeight / 2;
    view.z = Math.max(view.z, 1.4);
  }
});

/* ================= drawer ================= */

const drawer = document.getElementById("drawer"), shade = document.getElementById("shade");
const dtitle = document.getElementById("dtitle"), dbody = document.getElementById("dbody");
const dback = document.getElementById("dback"), dclose = document.getElementById("dclose");
let navStack = [];
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(ms){ return new Date(ms).toISOString().slice(0,16).replace("T"," ") + " UTC"; }
function openDrawer(title, html, back) {
  dtitle.textContent = title; dbody.innerHTML = html;
  drawer.classList.add("on"); shade.classList.add("on");
  if (back) { navStack.push(back); dback.hidden = false; } else { navStack = []; dback.hidden = true; }
}
function closeDrawer(){ drawer.classList.remove("on"); shade.classList.remove("on"); navStack = []; }
function goBack(){ if (navStack.length) { const b = navStack.pop(); navStack = []; openDrawer(b.title, b.html, b.back || null); } }
dclose.addEventListener("click", closeDrawer);
dback.addEventListener("click", goBack);
shade.addEventListener("click", closeDrawer);

function kvRows(rows){ return '<div class="kv">' + rows.map(r =>
  '<div class="r"><span class="k">' + esc(r[0]) + '</span><span class="v' + (r[2] ? " mono" : "") + '">' + r[1] + "</span></div>"
).join("") + "</div>"; }

function inspect(n) {
  if (n.type === "domain") {
    const caps = CAPTURES[n.data.origin];
    let html = kvRows([["origin", n.data.origin, true], ["captures", String(n.data.captures), true]]);
    if (caps) {
      html += '<div class="dsec"><h4>captures</h4>' + caps.map(c =>
        '<div class="crow" onclick="viewCapture(' + c[0] + ')"><span class="t">' + esc(c[2]) + '</span><span class="s">' + esc(c[1]) + "</span></div>"
      ).join("") + "</div>";
    } else {
      html += '<div class="dsec"><h4>captures</h4><div class="empty">not baked into this build — ask to add it</div></div>';
    }
    openDrawer("Domain", html);
  } else if (n.type === "capture") {
    viewCapture(n.data.id);
  } else if (n.type === "term") {
    const d = TERMDATA[n.data.t];
    openDrawer("Term", d ? kvRows([
      ["term_id", n.data.t, true],
      ["label", d[0]],
      ["facet", d[2]],
      ["kind", FACET_KINDS[d[2]] || "", true],
      ["definition", d[1]]
    ]) : kvRows([["term_id", n.data.t, true]]));
  } else if (n.type === "family") {
    openDrawer("Font family", kvRows([
      ["family_id", String(n.data.id), true],
      ["name", n.label],
      ["vendor", n.data.vendor]
    ]) + '<div class="dsec"><h4>hint</h4><div class="empty">double-click to reveal vendor · releases not baked</div></div>');
  } else if (n.type === "facet") {
    const f = FACETS.find(x => x[0] === n.data.fid);
    openDrawer("Facet", f ? kvRows([
      ["facet_id", f[0], true],
      ["label", f[1]],
      ["cardinality", f[2], true],
      ["terms", String(f[3]), true],
      ["definition", f[4]]
    ]) + '<div class="dsec"><h4>hint</h4><div class="empty">double-click the node to expand all ' + f[3] + ' terms</div></div>' : "");
  } else if (n.type === "color") {
    openDrawer("Color role", kvRows([
      ["role", n.data.role],
      ["rgb", n.data.r + ", " + n.data.g + ", " + n.data.b, true],
      ["occurrences", String(n.data.occ), true],
      ["capture", "8784 · 21st.dev /home", true]
    ]));
  } else if (n.type === "obs" || n.type === "enrich" || n.type === "retrieval" || n.type === "ontology") {
    openDrawer(esc(n.label), kvRows([
      ["relation", n.label, true],
      ["description", n.data.desc || ""],
      ["rows", n.data.n === null || n.data.n === undefined ? "present" : n.data.n.toLocaleString(), true]
    ]));
  } else {
    openDrawer(esc(n.label), kvRows([["type", n.type, true]]));
  }
}

function viewCapture(id) {
  let origin = null, meta = null;
  for (const [o, caps] of Object.entries(CAPTURES)) {
    const f = caps.find(c => c[0] === id);
    if (f) { origin = o; meta = f; break; }
  }
  const deep = DEEP[id];
  let html = meta ? kvRows([
    ["capture_id", String(id), true],
    ["domain", origin, true],
    ["path", meta[1], true],
    ["title", meta[2]],
    ["captured_at", fmt(meta[3]), true],
    ["screenshot", '<a class="ext" href="https://pin.fontofweb.com/' + id + '" target="_blank">pin.fontofweb.com/' + id + " ↗</a>", false]
  ]) : "";
  if (deep) {
    if (deep.color_roles.length) {
      html += '<div class="dsec"><h4>color roles</h4>' + deep.color_roles.map(c =>
        '<div class="crow"><span class="sw" style="background:rgb(' + c[1] + "," + c[2] + "," + c[3] + ')"></span><span class="t">' + esc(c[0]) + '</span><span class="s">' + c[1] + "," + c[2] + "," + c[3] + " · " + c[4] + " occ</span></div>"
      ).join("") + "</div>";
    }
    if (deep.terms.length) {
      html += '<div class="dsec"><h4>resolved terms</h4>' + deep.terms.map(t =>
        '<div class="crow"><span class="t">' + esc(TERMDATA[t[0]] ? TERMDATA[t[0]][0] : t[0]) + '</span><span class="s">' + Math.round(t[1]*100) + "%</span></div>" +
        '<div class="bar"><i style="width:' + Math.round(t[1]*100) + '%"></i></div>'
      ).join("") + "</div>";
    }
  } else {
    html += '<div class="dsec"><h4>deep profile</h4><div class="empty">only identity is baked for this capture — ask to add its profile</div></div>';
  }
  openDrawer("Capture " + id, html);
}

/* ---------- boot ---------- */

requestAnimationFrame(tick);
requestAnimationFrame(() => {
  const b = document.body.getBoundingClientRect();
  view.tx = b.width / 2; view.ty = b.height / 2;
});
</script>
</body>
</html>
