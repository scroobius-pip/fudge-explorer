<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fudge Ontology 1.1.0</title>
<style>
  :root { --ink:#111; --mut:#8a8a8a; --line:#e7e7e7; --soft:#f5f5f5; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font: 14px/1.55 -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #fff;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 18px 32px 14px;
  }
  .topline { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .title { font-size:13px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
  .title .ver { color: var(--mut); font-weight:400; }
  .meta { font-size:11px; color: var(--mut); letter-spacing:.04em; }
  .search {
    margin-top:10px;
    width:100%;
    max-width:380px;
    font: inherit;
    font-size:13px;
    color: var(--ink);
    border:none; border-bottom:1px solid #ccc;
    padding:6px 0; outline:none; background:transparent;
  }
  .search::placeholder { color:#b4b4b4; }
  .search:focus { border-bottom-color: var(--ink); }
  .hint { font-size:10px; color:#b4b4b4; letter-spacing:.08em; margin-left:8px; }
  #board {
    padding: 34px 32px 80px;
    column-width: 300px;
    column-gap: 60px;
    column-fill: balance;
  }
  section.facet {
    break-inside: avoid;
    margin: 0 0 34px;
  }
  .fhead {
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px; margin-bottom: 10px;
  }
  .fname {
    font-size:10px; font-weight:600;
    letter-spacing:.18em; text-transform:uppercase;
  }
  .fside { font-size:10px; color:var(--mut); letter-spacing:.06em; white-space:nowrap; }
  .fdef { font-size:11px; color:var(--mut); margin: 0 0 10px; }
  .term {
    position: relative;
    font-size: 13px;
    padding: 2px 6px 2px 2px;
    margin: 0 -6px 0 0;
    border-radius: 2px;
    cursor: default;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .term:hover { background: var(--soft); }
  .term .id { display:none; }
  .children { margin: 1px 0 2px 9px; padding-left: 11px; border-left: 1px solid var(--line); }
  .dim { opacity: .14; }
  .hit { font-weight: 600; }
  #tip {
    position: fixed; z-index: 20; pointer-events: none;
    max-width: 340px;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
    padding: 10px 12px;
    font-size: 12px;
  }
  #tip .tl { font-weight:600; font-size:13px; margin-bottom:2px; }
  #tip .td { color:#444; margin-bottom:6px; }
  #tip .tm { font-size:10.5px; color:var(--mut); letter-spacing:.02em; }
  #tip .tm b { font-weight:600; color:#555; }
  footer {
    padding: 16px 32px 28px;
    font-size: 11px; color: var(--mut); letter-spacing:.03em;
    border-top: 1px solid var(--line);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  #count { font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { header, #board, footer { padding-left:20px; padding-right:20px; } }
</style>
</head>
<body>

<header>

</header>

<div id="board"></div>

<footer>
  <span id="count"></span>

    ["page.documentation.article", "Documentation article", "Guide, concept, tutorial, or prose documentation page."],
    ["page.marketing", "Marketing page", "Public-facing page that introduces, explains, or converts interest in a product, service, person, or organization."],
    ["page.marketing.about", "About page", "Page whose dominant purpose is explaining the company, team, mission, or personal background."],
    ["page.marketing.home", "Home page", "Broad entry page that routes visitors to multiple product, content, or company destinations."],
    ["page.marketing.landing", "Landing page", "Marketing page with a narrower conversion objective and dominant call to action."],
    ["page.marketing.portfolio", "Portfolio page", "Page whose dominant purpose is showcasing work, case studies, projects, or personal/agency capabilities."],
    ["page.marketing.pricing", "Pricing page", "Page whose dominant purpose is comparing plans, prices, packaging, or purchase tiers."],
    ["page.system", "System page", "Search, error, status, or other system-level utility page."],
    ["page.system.error", "Error page", "Not found, unavailable, failed request, or equivalent error page."],
    ["page.system.search_results", "Search results", "Page whose dominant task is showing results for a query."],
    ["page.unknown", "Unknown page role", "Insufficient evidence to assign a page role."]
  ],
  section_pattern: [
    ["section.commercial", "Commercial section", "Section supporting purchase, comparison, product selection, or pricing decisions."],
    ["section.commercial.comparison", "Comparison section", "Section comparing products, plans, features, competitors, or alternatives."],
    ["section.commercial.pricing", "Pricing section", "Section with plans, prices, billing toggles, packages, or purchase tiers."],
    ["section.content.related_content", "Related content section", "Section linking to related articles, posts, resources, projects, or products."],
    ["section.conversion.cta", "CTA section", "Section centered on a call to action such as starting, buying, booking, contacting, or signing up."],
    ["section.marketing", "Marketing section", "Section that introduces, explains, or supports marketing conversion."],
    ["section.marketing.features", "Features section", "Section listing product, service, or offering features."],
    ["section.marketing.hero", "Hero section", "Prominent introductory section, usually near the top, with headline and primary action or media."],
    ["section.marketing.how_it_works", "How it works section", "Section explaining process, steps, workflow, or setup."],
    ["section.marketing.logo_cloud", "Logo cloud", "Row or group of customer, partner, publication, or integration logos."],
    ["section.marketing.stats", "Stats section", "Section presenting quantified facts, metrics, usage numbers, or impact figures."],
    ["section.marketing.testimonials", "Testimonials section", "Section grouping customer quotes, endorsements, reviews, or social proof statements."],
    ["section.structural.footer", "Footer", "Bottom structural section with site links, legal links, newsletter, contact, or copyright."],
    ["section.support.faq", "FAQ section", "Section containing frequently asked questions and answers."]
  ],
  typography_generic: [
    ["typography.generic.display_decorative", "Display or decorative", "Display, decorative, novelty, or highly expressive font class."],
    ["typography.generic.monospace", "Monospace", "Monospace font class."],
    ["typography.generic.sans_serif", "Sans serif", "Sans-serif font class."],
    ["typography.generic.script_handwriting", "Script or handwriting", "Script, cursive, handwritten, or calligraphic font class."],
    ["typography.generic.serif", "Serif", "Serif font class."],
    ["typography.generic.slab_serif", "Slab serif", "Slab-serif font class."],
    ["typography.generic.unknown", "Unknown generic class", "Insufficient evidence to classify the generic font class."]
  ],
  typography_role: [
    ["typography.role.body", "Body role", "Font is used for body copy or paragraphs."],
    ["typography.role.code", "Code role", "Font is used for code, terminal text, request examples, or response examples."],
    ["typography.role.display", "Display role", "Font is used for display-scale text or hero headlines."],
    ["typography.role.heading", "Heading role", "Font is used for section or content headings."],
    ["typography.role.numeric_data", "Numeric data role", "Font is used for metrics, tables, tabular numbers, or quantitative data."],
    ["typography.role.ui", "UI role", "Font is used for controls, labels, navigation, or interface chrome."]
  ],
  typography_system_size: [
    ["typography.system_size.multi_family", "Multi-family type system", "Three or more meaningful text families are used."],
    ["typography.system_size.paired", "Paired type system", "Exactly two meaningful text families are used, each owning a stable role or at least about 10 percent of visible text."],
    ["typography.system_size.single_family", "Single-family type system", "One meaningful text family is used for visible text roles."],
    ["typography.system_size.unknown", "Unknown type system size", "Insufficient evidence to count meaningful text families."]
  ],
  visual_background: [
    ["visual.background.gradient", "Gradient background", "CSS gradient or visually detected continuous color transition covers a material region."],
    ["visual.background.image", "Image background", "Dominant background is photographic, illustrative, rendered, or otherwise image-based."],
    ["visual.background.mixed", "Mixed background", "No single background treatment dominates the capture."],
    ["visual.background.pattern", "Pattern background", "Dominant background uses a repeated or decorative pattern."],
    ["visual.background.solid", "Solid background", "Dominant background is a flat solid color."],
    ["visual.background.unknown", "Unknown background", "Insufficient evidence to classify the background treatment."]
  ],
  visual_corner: [
    ["visual.corner.mixed", "Mixed corners", "Multiple corner treatments are materially represented without one dominant profile."],
    ["visual.corner.pill_dominant", "Pill-dominant corners", "At least about 30 percent of prominent controls have radius close to half their height."],
    ["visual.corner.rounded", "Rounded corners", "At least half of visible bounded surfaces have estimated or computed radius of about 8px or more."],
    ["visual.corner.square", "Square corners", "Most prominent bounded surfaces and controls use square or near-square corners."],
    ["visual.corner.unknown", "Unknown corners", "Insufficient evidence to classify corner profile."]
  ],
  visual_surface: [
    ["visual.surface.border_separated", "Border-separated surfaces", "Borders are a prominent mechanism for separating surfaces or content groups."],
    ["visual.surface.flat", "Flat surfaces", "Primary surfaces have little visible separation through shadows, borders, or translucency."],
    ["visual.surface.layered", "Layered surfaces", "Overlapping or stacked surfaces create a visible layering system."],
    ["visual.surface.shadowed", "Shadowed surfaces", "Shadows materially separate cards, panels, controls, or layers."],
    ["visual.surface.translucent", "Translucent surfaces", "Panels or controls use transparency or backdrop visibility."]
  ],
  visual_trait: [
    ["visual.trait.backdrop_blur", "Backdrop blur", "CSS backdrop-filter or equivalent translucency-plus-blur evidence is present.", "observable"],
    ["visual.trait.card_heavy", "Card-heavy", "At least half of primary content units are visually bounded independent surfaces.", "observable"],
    ["visual.trait.grain_noise", "Grain or noise", "Visible grain, noise texture, or similar raster texture is used decoratively.", "observable"],
    ["visual.trait.large_type", "Large type", "Largest visible non-logo text is at least 64px on desktop, 40px on mobile, or about 8 percent of viewport height.", "computed"]
  ]
};

const CARD_GLYPH = { score: "~", single: "1", multi: "n", occurrence: "+", structured: "{}" };
const KIND_LABEL = { soft_semantic: "soft score", grounded_semantic: "grounded semantic", computed: "computed", observable: "observable" };

const ids = new Set(Object.values(TERMS).flat().map(t => t[0]));
const parentOf = id => {
  const cut = id.lastIndexOf(".");
  if (cut < 0) return null;
  const p = id.slice(0, cut);
  return ids.has(p) ? p : null;
};

const byFacet = facet => TERMS[facet] || [];
const childrenOf = (facet, id) => byFacet(facet).filter(t => parentOf(t[0]) === id);
const kindOf = (facet, term) => term.length > 3 ? term[3] : (FACETS.find(f => f[0] === facet) || [])[4];

const board = document.getElementById("board");
const tip = document.getElementById("tip");
const q = document.getElementById("q");
const countEl = document.getElementById("count");
const total = Object.values(TERMS).flat().length;

let query = "";

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function termRow(term, facet) {
  const [id, label, def] = term;
  const el = document.createElement("div");
  el.className = "term";
  el.textContent = label;
  el.dataset.id = id;
  el.dataset.facet = facet;
  el.addEventListener("mouseenter", () => showTip(el, term, facet));
  el.addEventListener("mouseleave", hideTip);
  return el;
}

function renderTerms(facet, parent, match) {
  const kids = childrenOf(facet, parent);
  const frag = document.createDocumentFragment();
  for (const t of kids) {
    const el = termRow(t, facet);
    const id = t[0];
    const isHit = match && (id.toLowerCase().includes(match) || t[1].toLowerCase().includes(match));
    if (query && !isHit) el.classList.add("dim");
    if (query && isHit) el.classList.add("hit");
    frag.appendChild(el);
    const grand = renderTerms(facet, id, match);
    if (grand.children.length) {
      const wrap = document.createElement("div");
      wrap.className = "children";
      wrap.appendChild(grand);
      frag.appendChild(wrap);
    }
  }
  return frag;
}

function render() {
  board.innerHTML = "";
  const match = query ? query.trim().toLowerCase() : "";
  let hits = 0;
  for (const [fid, flabel, card, fdef, kind] of FACETS) {
    const terms = byFacet(fid);
    const facetHits = match ? terms.filter(t =>
      t[0].toLowerCase().includes(match) || t[1].toLowerCase().includes(match)
    ).length : terms.length;
    hits += facetHits;

    const sec = document.createElement("section");
    sec.className = "facet";
    if (match && facetHits === 0) sec.classList.add("dim");

    const head = document.createElement("div");
    head.className = "fhead";
    const name = document.createElement("span");
    name.className = "fname";
    name.textContent = flabel;
    const side = document.createElement("span");
    side.className = "fside";
    side.textContent = (CARD_GLYPH[card] || "") + "  " + terms.length;
    side.title = "cardinality: " + card + " · assignment: " + KIND_LABEL[kind];
    head.append(name, side);
    sec.appendChild(head);

    const def = document.createElement("div");
    def.className = "fdef";
    def.textContent = fdef;
    sec.appendChild(def);

    sec.appendChild(renderTerms(fid, null, match));
    board.appendChild(sec);
  }
  countEl.textContent = "28 facets · " + total + " terms" + (query ? "  ·  " + hits + " match" + (hits === 1 ? "" : "es") : "");
}

function showTip(el, term, facet) {
  const [id, label, def] = term;
  const facetDef = FACETS.find(f => f[0] === facet);
  tip.innerHTML =
    '<div class="tl">' + esc(label) + "</div>" +
    '<div class="td">' + esc(def) + "</div>" +
    '<div class="tm"><b>' + esc(facetDef[1]) + "</b> &nbsp;·&nbsp; " +
    esc(KIND_LABEL[kindOf(facet, term)]) + "<br>" + esc(id) + "</div>";
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.right + 10, y = r.top;
  if (x + tw > innerWidth - 8) x = r.left - tw - 10;
  if (y + th > innerHeight - 8) y = innerHeight - th - 8;
  if (x < 8) x = 8;
  if (y < 8) y = 8;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}

function hideTip() { tip.hidden = true; }

q.addEventListener("input", () => { query = q.value; render(); });
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement === q) { q.value = ""; query = ""; render(); q.blur(); }
});

document.getElementById("meta").textContent = "28 facets · " + total + " terms";
render();
</script>
</body>
