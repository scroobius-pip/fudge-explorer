<html lang="en">

<title>Fudge — Explorer</title>

<style>

  .schema-column { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px 10px; padding:5px 0; border-bottom:1px solid var(--line); font-size:11px; }
  .schema-column .name { min-width:0; overflow-wrap:anywhere; }
  .schema-column .type { white-space:nowrap; color:var(--mut); }
  .key-badge { margin-left:5px; color:var(--violet); font-size:8px; text-transform:uppercase; font-weight:600; }
  @media (max-width:760px) {
    header { grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; padding:9px 14px 10px; }
    .brand-block { gap:9px; }
    .meta { font-size:9px; }
    .wrap { grid-column:1 / -1; grid-row:2; }
    .top-actions { grid-column:2; grid-row:1; }
    .theme-icon { display:none; }
    .design-cta { min-height:27px; padding:3px 8px; }
  }
  @media (max-width:480px) {
    header { grid-template-columns:1fr; }
    .brand-block { justify-content:space-between; }
    .top-actions { grid-column:1; grid-row:2; justify-content:space-between; }
    .wrap { grid-row:3; }
  }
</style>
<style id="font-faces"></style>
</head>
<body>

<header>
  <div class="brand-block">
    <div class="title">Fudge <span>Explorer</span></div>
    <div class="meta" id="meta">loading…</div>
  </div>
  <div class="wrap">
    <input class="search" id="q" type="search" placeholder="Search anything…  ↑↓ Enter · Esc closes column" autocomplete="off" spellcheck="false">
    <div id="results"></div>
  </div>
  <div class="top-actions">
    <label class="theme-control" title="Theme">
      <span class="theme-icon" aria-hidden="true">◐</span>
      <select id="theme-picker" class="theme-select" aria-label="Theme"></select>
    </label>
    <a class="design-cta" href="https://design.withfudge.com">Design with Fudge ↗</a>
  </div>
</header>

<main id="cols"></main>

<script>
let D_ = null, relations = [];
const INDEX_MAPS = ["cById","cByDomain","termsByCap","capsByTerm","fById","dgById","vById","fByDesigner","fByVendor","relsById","relCount","colorsByCap","legacyColorsByCap","bgByCap","fontsByCap","typeByCap","famByNorm","capsByFam","famGroups","textByCap","histByCap","structuresByCap","annByCap","motionByCap","videoByCap","gradientsByCap","simRes","catMatch","cByPath","cByTheme","cByDevice","cByState"];
const createIndexes = () => Object.assign(Object.fromEntries(INDEX_MAPS.map(k => [k, new Map()])), { embeddedById:new Set() });
let idx = createIndexes();
const colsEl = document.getElementById("cols");
const TYPE = {
  home:{label:"dataset",color:"var(--entity-ink)"}, domain:{label:"domain",color:"var(--entity-domain)"},
  capture:{label:"capture",color:"var(--entity-capture)"}, term:{label:"term",color:"var(--entity-term)"},
  facet:{label:"facet",color:"var(--entity-facet)"}, family:{label:"font family",color:"var(--entity-family)"},
  designer:{label:"designer",color:"var(--entity-designer)"}, vendor:{label:"vendor",color:"var(--entity-designer)"},
  browse:{label:"browse",color:"var(--entity-neutral)"}, index:{label:"index",color:"var(--entity-neutral)"},
  structure:{label:"structure",color:"var(--entity-structure)"}, motion:{label:"motion",color:"var(--entity-motion)"}, video:{label:"video",color:"var(--entity-video)"},
  runtime:{label:"runtime",color:"var(--entity-neutral)"}, section:{label:"section",color:"var(--entity-neutral)"},
  row:{label:"row",color:"var(--entity-neutral)"}, rawCapture:{label:"raw capture",color:"var(--entity-neutral)"},
  relations:{label:"schema",color:"var(--entity-neutral)"}, relation:{label:"relation",color:"var(--entity-neutral)"},
  fontSim:{label:"font similarity",color:"var(--entity-family)"}, fontLookup:{label:"similarity lookup",color:"var(--entity-family)"},
  embeddings:{label:"embeddings",color:"var(--entity-color)"}
};
const MAXCOLS = 7;
const NUMERIC_VIEWS = new Set(["capture","family","designer","vendor","motion","rawCapture","fontLookup"]);

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }
function escId(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
const dateMs = value => Number(value) < 1e12 ? Number(value) * 1000 : Number(value);
function fmtDate(ms){ return new Date(dateMs(ms)).toISOString().slice(0,10); }
const column = (type, id, label) => ({ type, id:NUMERIC_VIEWS.has(type) ? Number(id) : id, label });
function pushMap(map, key, value){
  if (!map.has(key)) map.set(key, []);
  map.get(key).push(value);
}
const termLabel = t => String((D_.terms[t] && D_.terms[t][0]) || t || "");
const termFacet = t => (D_.terms[t] && D_.terms[t][2]) || "";
const termDef   = t => (D_.terms[t] && D_.terms[t][1]) || "";
function famResolve(fam){
  const k = norm(fam);
  const cm = idx.catMatch.get(k);
  if (cm && cm.length && idx.fById.has(cm[0])) return idx.fById.get(cm[0]);
  return idx.famByNorm.get(k) || null;
}
function favicon(origin, inline){
  const label = String(origin||"").replace(/^https?:\/\//,"").replace(/\/$/,"").charAt(0).toUpperCase() || "·";
  const url = "https://www.google.com/s2/favicons?domain_url=" + encodeURIComponent(origin||"") + "&sz=64";
  return '<span class="favicon' + (inline ? " inline" : "") + '"><span class="fl">' + esc(label) + '</span><img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="' + esc(url) + '" alt="" onload="this.previousElementSibling.style.display=\'none\';this.style.display=\'block\'" onerror="this.remove()"></span>';
}
function capBadges(cid){
  const m = idx.motionByCap.get(cid);
  const v = idx.videoByCap.has(cid) || idx.embeddedById.has(cid);
  let b = "";
  if (m) b += ' <span class="motion-badge">▶ ' + Math.round(m[4]/1000) + "s</span>";
  if (v) b += ' <span class="video-badge">V</span>';
  return b;
}
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
const hex = (r,g,b) => "#" + [r,g,b].map(v => Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
const rgba = (r,g,b,a) => a == null || a >= 1000000 ? hex(r,g,b) : "rgba(" + [r,g,b,Math.max(0,Math.min(1,a/1000000))].join(",") + ")";
const px = m => m == null ? "" : (m/1000 >= 10 ? Math.round(m/1000) : (m/1000).toFixed(1)) + "px";

function buildIndexes() {
  idx = createIndexes();
  for (const c of D_.captures) {
    idx.cById.set(c[0], c);
    pushMap(idx.cByDomain, c[1], c);
    pushMap(idx.cByPath, c[2], c);
    pushMap(idx.cByTheme, c[7], c);
    pushMap(idx.cByDevice, c[6], c);
    pushMap(idx.cByState, c[8], c);
  }
  for (const [cid, tid, conf, scope, resolution] of D_.assignments) {
    pushMap(idx.termsByCap, cid, [tid, conf, scope, resolution]);
    pushMap(idx.capsByTerm, tid, [cid, conf, scope, resolution]);
  }
  for (const f of D_.families) {
    idx.fById.set(f[0], f);
    idx.famByNorm.set(norm(f[1]), f);
    const n = norm(f[1]);
    pushMap(idx.famGroups, n, f);
    if (f[2] != null) pushMap(idx.fByDesigner, f[2], f);
    if (f[3] != null) pushMap(idx.fByVendor, f[3], f);
  }
  for (const dg of D_.designers) idx.dgById.set(dg[0], dg);
  for (const v of D_.vendors) idx.vById.set(v[0], v);
  for (const r of D_.releases) {
    pushMap(idx.relsById, r[0], r);
    idx.relCount.set(r[0], (idx.relCount.get(r[0])||0) + 1);
  }
  for (const [cid, role, r, g, b, a, occ, rank] of D_.color_roles) {
    pushMap(idx.colorsByCap, cid, [role, r, g, b, a, occ, rank]);
  }
  for (const [cid, rows] of Object.entries(D_.legacy_colors || {})) idx.legacyColorsByCap.set(Number(cid), rows);
  for (const [cid, r, g, b, a, occ, evidence, oi] of D_.backgrounds) {
    pushMap(idx.bgByCap, cid, [r, g, b, a, occ, evidence, oi]);
  }
  for (const [cid, rows] of Object.entries(D_.gradients || {})) {
    idx.gradientsByCap.set(Number(cid), rows);
  }
  for (const [cid, oi, fam, stack, wmin, wmax, share, occ] of D_.font_obs) {
    pushMap(idx.fontsByCap, cid, [fam, stack, wmin, wmax, share, occ, oi]);
  }
  for (const [cid, role, fam, w, size, lh, share, rank, generic, style, tracking, occ, measure, conf, evidence] of D_.type_roles) {
    pushMap(idx.typeByCap, cid, [role, fam, w, size, lh, share, rank, generic, style, tracking, occ, measure, conf, evidence]);
  }
  for (const row of D_.text_styles || []) {
    /* [cid, declared_family, weight, size_milli_px, occurrence_count] */
    const [cid, fam, w, size, occ, oi, generic, style, lh, tracking, alignment, transform, r, g, b, alpha, share, evidence] = row;
    pushMap(idx.textByCap, cid, [fam, w, size, occ, oi, generic, style, lh, tracking, alignment, transform, r, g, b, alpha, share, evidence]);
  }
  for (const row of D_.hist_fonts || []) {
    /* [cid, family_id, family_name, sub_family_name, legacy_link_count] */
    const [cid, fid, name, sub, links, subId] = row;
    pushMap(idx.histByCap, cid, [fid, name, sub, links, subId]);
  }
  for (const row of D_.structures || []) {
    /* [cid, structure_id, parent_structure_id, term_id, x_q, y_q, width_q, height_q, confidence_ppm] */
    const [cid, sid, parent, tid, x, y, w, h, salience, repeat, columns, rows, gap, conf, evidence] = row;
    pushMap(idx.structuresByCap, cid, [sid, parent, tid, x, y, w, h, salience, repeat, columns, rows, gap, conf, evidence]);
  }
  for (const [cid, rows] of Object.entries(D_.ann || {})) {
    for (const r of rows) pushMap(idx.annByCap, Number(cid), [r[0], r[1]]);
  }
  for (const r of D_.motion_assets || []) {
    /* [cid, object_key, media_type, byte_length, duration_ms, width_px, height_px] */
    idx.motionByCap.set(r[0], r);
  }
  for (const v of D_.video_observations || []) {
    pushMap(idx.videoByCap, v.capture_id, [v.observation_index, v.x_q, v.y_q, v.width_q, v.height_q, v.coverage_ppm, v.occurrence_count]);
  }
  for (const c of D_.embedded_video_captures || []) idx.embeddedById.add(c.id);
  for (const [name, rows] of Object.entries(D_.font_similarity_results || {})) {
    idx.simRes.set(norm(name), rows);
  }
  for (const [name, ids] of Object.entries(D_.catalog_matches || {})) {
    idx.catMatch.set(norm(name), ids);
  }
  for (const cp of D_.captures) for (const fam of captureFamilies(cp[0])) pushMap(idx.capsByFam, norm(fam), [cp[0], fam]);
}

/* ---------- links ---------- */

const L = {
  term:  (tid, label) => '<a class="lk term" onclick="hop(\'term\',\'' + escId(tid) + '\',\'' + esc(String(label||termLabel(tid)||"").slice(0,40)) + '\')">' + esc(label||termLabel(tid)||tid) + "</a>",
  facet: (fid) => '<a class="lk term" onclick="hop(\'facet\',\'' + escId(fid) + '\',\'' + esc(String(fid||"").slice(0,40)) + '\')">' + esc((fid||"").replace(/_/g," ")) + "</a>",
  dom:   (origin) => '<a class="lk dom" onclick="hop(\'domain\',\'' + escId(origin) + '\',\'' + esc(String(origin||"").replace("https://","").slice(0,40)) + '\')">' + favicon(origin, true) + esc((origin||"").replace("https://","")) + "</a>",
  fam:   (id, name) => '<a class="lk fam" onclick="hop(\'family\',' + id + ',\'' + esc(String(name||"").slice(0,40)) + '\')">' + esc(name||"family " + id) + "</a>",
  cap:   (id, title) => '<a class="lk" onclick="hop(\'capture\',' + id + ',\'' + esc(String(title||"").slice(0,40)) + '\')">' + esc(title||("capture " + id)) + "</a>",
  browse:(kind, value, label) => '<a class="lk" onclick="hop(\'browse\',\'' + kind + '\',\'' + esc(String(label||value||"").slice(0,40)) + '\')">' + esc(label||value||"") + "</a>",
  fs:    (label) => '<a class="lk fam" onclick="hop(\'fontSim\',\'font-similarity\',\'' + esc(String(label||"").slice(0,40)) + '\')">' + esc(label||"font similarity") + "</a>",
  rel:   (label) => '<a class="lk" onclick="hop(\'relations\',\'relations\',\'' + esc(String(label||"").slice(0,40)) + '\')">' + esc(label||"relations") + "</a>",
  run:   (label) => '<a class="lk" onclick="hop(\'runtime\',\'runtime\',\'' + esc(String(label||"").slice(0,40)) + '\')">' + esc(label||"runtime") + "</a>",
  sec:   (cid, key, label) => '<a class="lk" onclick="hop(\'section\',\'' + cid + ':' + key + '\',\'' + esc(String(label||"").slice(0,40)) + '\')">' + esc(label||key) + "</a>",
  motion:(cid, label) => '<a class="lk motion-badge" onclick="hop(\'motion\',\'' + cid + '\',\'motion #' + cid + '\')">' + esc(label||"motion") + "</a>",
  filter:(route, kind, label) => '<a class="lk" onclick="hop(\'browse\',\'' + escId("filter|" + route + "|" + kind) + '\',\'' + esc(String(label||"").slice(0,40)) + '\')">' + esc(label||kind) + "</a>",
  index: (kind, label) => '<a class="lk" onclick="hop(\'index\',\'' + kind + '\',\'' + esc(String(label||"").slice(0,40)) + '\')">' + esc(label||kind) + "</a>"
};

/* ---------- column stack ---------- */

const cols = [];
let suppressHash = false, bundleGeneration = 0;
const homeColumn = () => column("home", "", "The dataset");
const columnKey = c => JSON.stringify([c.type, c.id, c.label]);
const columnIdentity = c => JSON.stringify(c.type === "browse" ? [c.type, c.id, c.label] : [c.type, c.id]);
function stackHash(stack = cols){
  const payload = stack.slice(1).map(c => [c.type, c.id, c.label]);
  return payload.length ? "#stack/" + encodeURIComponent(JSON.stringify(payload)) : "";
}
function syncHash(replace = false){
  const h = stackHash();
  if (location.hash === h) return;
  suppressHash = true;
  try {
    history[replace ? "replaceState" : "pushState"](null, "", h || (location.pathname + location.search));
  } catch (_) { if (h) location.hash = h; }
  queueMicrotask(() => { suppressHash = false; });
}
function legacyStack(hash){
  const m = String(hash || "").match(/^#([^/]+)\/(.+)$/);
  if (!m) return null;
  let type, id;
  try { type = decodeURIComponent(m[1]); id = decodeURIComponent(m[2]); } catch (_) { return null; }
  if (!Object.hasOwn(VIEWS, type)) return null;
  if (NUMERIC_VIEWS.has(type) && !Number.isFinite(Number(id))) return null;
  let label = id;
  if (type === "capture") { const cp = idx.cById.get(Number(id)); if (cp) label = cp[3]; }
  else if (type === "domain") label = String(id).replace("https://","");
  else if (type === "term") label = String(termLabel(id) || id);
  else if (type === "family") { const f = idx.fById.get(Number(id)); if (f) label = f[1]; }
  else if (type === "browse") {
    if (id.startsWith("~[")) {
      try { [id, label] = JSON.parse(id.slice(1)); } catch (_) { return false; }
    }
    else { const sep = id.lastIndexOf("|"); if (sep > 0) { label = id.slice(sep + 1); id = id.slice(0, sep); } }
  }
  return [homeColumn(), column(type, id, label)];
}
function stackFromHash(hash){
  if (!hash) return [homeColumn()];
  if (!String(hash).startsWith("#stack/")) return legacyStack(hash);
  try {
    const rows = JSON.parse(decodeURIComponent(String(hash).slice(7)));
    if (!Array.isArray(rows) || rows.length > MAXCOLS - 1) return null;
    const stack = [homeColumn()];
    for (const row of rows) {
      if (!Array.isArray(row) || row.length < 2 || !Object.hasOwn(VIEWS, row[0])) return null;
      if (NUMERIC_VIEWS.has(row[0]) && !Number.isFinite(Number(row[1]))) return null;
      stack.push(column(row[0], row[1], String(row[2] ?? row[1])));
    }
    return stack;
  } catch (_) { return null; }
}
function setColumns(next, { animate = false, historyMode = "push" } = {}){
  cols.splice(0, cols.length, ...next);
  renderCols(animate);
  if (historyMode) syncHash(historyMode === "replace");
}
function openHash(hash, canonicalize = false){
  const stack = stackFromHash(hash);
  if (!stack) return false;
  try { setColumns(stack, { historyMode:null }); } catch (_) { return false; }
  if (canonicalize || !String(hash || "").startsWith("#stack/")) syncHash(true);
  return true;
}
function retractTo(i){ setColumns(cols.slice(0, i + 1)); }
function closeCol(i){ if (i > 0) setColumns(cols.slice(0, i)); }
function hop(type, id, label){
  const last = cols[cols.length-1];
  const next = column(type, id, label);
  if (last && columnIdentity(last) === columnIdentity(next)) return;
  const stack = [...cols, next];
  if (stack.length > MAXCOLS) stack.splice(1, stack.length - MAXCOLS);
  setColumns(stack, { animate:true });
}
function fresh(type, id, label){
  setColumns([homeColumn(), column(type, id, label)], { animate:true });
}

const moreRows = new Map();
let moreRowsSeq = 0;
const rowsHtml = (list, fn, limit) => {
  const cut = limit ? list.slice(0, limit) : list;
  let more = "";
  if (limit && list.length > limit) {
    const id = ++moreRowsSeq;
    moreRows.set(id, { list, fn, limit, next:limit });
    more = '<button class="more" data-more-id="' + id + '" onclick="loadMoreRows(this,' + id + ')">+ ' + (list.length - limit) + " more</button>";
  }
  return cut.map(fn).join("") + more;
};
function loadMoreRows(button, id){
  const state = moreRows.get(id);
  if (!state) { button.remove(); return; }
  const start = state.next, end = Math.min(start + state.limit, state.list.length);
  const html = state.list.slice(start, end).map((value, index) => state.fn(value, start + index)).join("");
  button.insertAdjacentHTML("beforebegin", html);
  state.next = end;
  const remaining = state.list.length - end;
  if (remaining) button.textContent = "+ " + remaining + " more";
  else { moreRows.delete(id); button.remove(); }
}
function releaseMoreRows(root){
  root.querySelectorAll("[data-more-id]").forEach(button => moreRows.delete(Number(button.dataset.moreId)));
}
function navRow(type, id, label, meta, content, className = "row"){
  const handler = "hop(" + [type, id, String(label || "").slice(0,34)].map(JSON.stringify).join(",") + ")";
  return '<button class="' + escAttr(className) + '" onclick="' + escAttr(handler) + '"><span class="t">' + (content == null ? esc(label) : content) + '</span><span class="s">' + esc(meta || "") + "</span></button>";
}
function renderCols(animate){
  const mounted = [...colsEl.children];
  let keep = 0;
  while (keep < mounted.length && keep < cols.length && Number(mounted[keep].dataset.generation) === bundleGeneration && mounted[keep].dataset.columnKey === columnKey(cols[keep])) keep++;
  const changed = keep < mounted.length || keep < cols.length;
  for (let i = mounted.length - 1; i >= keep; i--) { releaseMoreRows(mounted[i]); mounted[i].remove(); }
  for (let i = keep; i < cols.length; i++) {
    const c = cols[i];
    const el = document.createElement("div");
    el.dataset.columnKey = columnKey(c);
    el.dataset.generation = bundleGeneration;
    el.className = "col" + (animate && i === cols.length-1 ? " enter" : "");
    colsEl.appendChild(el);
    const mount = html => {
      if (!el.isConnected) return;
      releaseMoreRows(el);
      el.innerHTML = html;
      if (i > 0) {
        const header = el.querySelector(".chead");
        if (header) header.addEventListener("click", () => retractTo(i-1));
        const x = el.querySelector(".x");
        if (x) x.addEventListener("click", e => { e.stopPropagation(); closeCol(i); });
      }
    };
    const output = VIEWS[c.type](c);
    if (output && typeof output.then === "function") {
      mount(head(c) + '<div class="cbody"><div class="empty">loading…</div></div>');
      output.then(mount, error => mount(head(c) + '<div class="cbody"><div class="empty">' + esc(error) + "</div></div>"));
    } else mount(output);
  }
  [...colsEl.children].forEach((el, i) => el.classList.toggle("active", i === cols.length - 1));
  if (changed) colsEl.scrollTo({ left:colsEl.scrollWidth, behavior:"smooth" });
}
function head(c, n){
  const lead = c.type === "domain" ? favicon(c.id) : '<span class="dot" style="background:' + TYPE[c.type].color + '"></span>';
  return '<div class="chead">' + lead +
    '<span class="t">' + esc(c.label) + '</span>' + (n ? '<span class="n">' + n + "</span>" : "") +
    (c.type !== "home" ? '<span class="x">✕</span>' : "") + "</div>";
}
const page = (c, n, content) => head(c, n) + '<div class="cbody">' + content + "</div>";
const section = (title, content, count) => '<div class="sec"><h4>' + title + (count == null ? "" : ' <span class="n">' + count + "</span>") + "</h4>" + content + "</div>";
const listPage = (c, metric, prose, title, count, content) => page(c, metric, '<p class="prose">' + prose + "</p>" + section(title, content, count) + foot(c));
/* ---------- generic filtered views ---------- */

const ROUTE_SOURCES = {
  all: () => D_.captures.map(cp => cp[0]),
  cap: v => [Number(v)],
  mov: v => idx.motionByCap.has(Number(v)) ? [Number(v)] : [],
  vid: v => idx.videoByCap.has(Number(v)) || idx.embeddedById.has(Number(v)) ? [Number(v)] : [],
  dom: v => (idx.cByDomain.get(v) || []).map(cp => cp[0]),
  fam: v => ((idx.capsByFam.get(norm((idx.fById.get(Number(v)) || [])[1])) || []).map(([cid]) => cid)),
  ter: v => (idx.capsByTerm.get(v) || []).map(([cid]) => cid),
  fac: v => Object.keys(D_.terms).filter(t => termFacet(t) === v).flatMap(t => (idx.capsByTerm.get(t) || []).map(([cid]) => cid))
};
const CAPTURE_FILTERS = {
  motion: cid => idx.motionByCap.has(cid),
  video: cid => idx.videoByCap.has(cid) || idx.embeddedById.has(cid),
  colors: cid => (idx.colorsByCap.get(cid) || []).length || (idx.legacyColorsByCap.get(cid) || []).length,
  gradients: cid => (idx.gradientsByCap.get(cid) || []).length,
  typography: cid => (idx.typeByCap.get(cid) || []).length,
  text: cid => (idx.textByCap.get(cid) || []).length

  if (types.length) colsRows.push(evRow("Typography", types.slice(0,3).map(t => t[0]).join(" · "), types.length, "section", id + ":typography", "Typography"));
  if (dom && dom.types.length) colsRows.push(evRow("Domain typography", [...new Set(dom.types.map(t => t[0]))].slice(0,3).join(" · "), dom.types.length, "browse", "filter|dom|" + cp[1] + "|typography", "Domain typography"));
  if (textAgg.length) colsRows.push(evRow("Text styles", famNames(textAgg) || "weight & size measurements", textAgg.length, "section", id + ":text", "Text styles"));

  if (grads.length) layoutRows.push(evRow("Gradients", [...new Set(grads.map(g => g.kind))].join(" · "), grads.length, "section", id + ":gradients", "Gradients"));
  layoutRows.push(evRow("Measured effects", "borders · shadows · radii · spacing · media", "live", "section", id + ":effects", "Measured effects"));
  if (dom && dom.grads.length) layoutRows.push(evRow("Domain gradients", [...new Set(dom.grads.map(g => g.kind))].join(" · "), dom.grads.length, "browse", "filter|dom|" + cp[1] + "|gradients", "Domain gradients"));
  const layoutGroup = layoutRows.length ? '<div class="sec"><h4>layout & effects</h4>' + layoutRows.join("") + "</div>" : "";
  const roleRows = [];

  if (dom && dom.terms.length) roleRows.push(evRow("Domain terms", dom.terms.slice(0,3).map(([t]) => termLabel(t)).map(esc).join(" · "), dom.terms.length, "browse", "filter|dom|" + cp[1] + "|terms", "Domain terms"));
  if (hists.length) roleRows.push(evRow("Legacy attributions", hists.slice(0,3).map(h => h[2]).map(esc).join(" · "), hists.length, "section", id + ":hist", "Legacy attributions"));
  const roleGroup = roleRows.length ? '<div class="sec"><h4>design roles</h4>' + roleRows.join("") + "</div>" : "";
  const domNote = dom

    : "";
  const simRows = [];
  if (ann.length || liveAnn) simRows.push(evRow("Visual neighbors", liveAnn ? "query the active screenshot index" : ann.length + " nearest captures", liveAnn ? "live" : ann.length, "section", id + ":ann", "Visual neighbors"));

  return head(c, "#" + id) +
    '<div class="cbody">' +

      ["device", lkDevice, false],
      ["theme", lkTheme, false],
      ["state", lkState, false]
    ]) +

    foot(c) + "</div>";
}

function vSection(c){
  const [cid, key] = String(c.id).split(":");
  const cp = idx.cById.get(Number(cid));
  const label = (SECTION_DESC[key] ? key : "section") + (cp ? " · " + cp[3].slice(0, 26) : "");
  if (!cp || !SECTION_DESC[key]) return head(c) + '<div class="cbody"><div class="empty">section not found</div></div>';
  const id = Number(cid);
  if (key === "ann" && D_.embedding_runtime?.active_generation_id) return vCaptureNeighbors(c, cp);
  if (key === "effects") return vCaptureEffects(c, cp);
  if (key === "gradients") return vCaptureGradients(c, cp);
  const raw = sectionRaw(key, id);
  let body = "";
  if (key === "colors") {
    body = rowsHtml(idx.colorsByCap.get(id) || [], (row, i) =>
      '<button class="row" onclick="hop(\'row\',\'' + id + '|colors|' + i + '\',\'color row ' + (i + 1) + '\')"><span class="sw" style="background:' + rgba(row[1], row[2], row[3], row[4]) + '"></span><span class="t">' + esc(row[0]) + '</span><span class="s">' + hex(row[1], row[2], row[3]) + (row[4] != null && row[4] < 1000000 ? " · " + Math.round(row[4]/10000) + "% alpha" : "") + (row[5] ? " · " + row[5] + "×" : "") + "</span></button>");
  } else if (key === "backgrounds") {
    const bg = idx.bgByCap.get(id) || [];
    body = (bg.length ? '<span class="sw big" style="background:' + rgba(bg[0][0], bg[0][1], bg[0][2], bg[0][3]) + '"></span>' : "") +
      rowsHtml(bg.slice(0, 12), (row, i) =>
        '<button class="row" onclick="hop(\'row\',\'' + id + '|backgrounds|' + i + '\',\'background row ' + (i + 1) + '\')"><span class="sw" style="background:' + rgba(row[0], row[1], row[2], row[3]) + '"></span><span class="t">background</span><span class="s">' + hex(row[0], row[1], row[2]) + (row[3] != null && row[3] < 1000000 ? " · " + Math.round(row[3]/10000) + "% alpha" : "") + (row[4] ? " · " + row[4] + "×" : "") + "</span></button>");
  } else if (key === "fonts") {
    body = rowsHtml(idx.fontsByCap.get(id) || [], (row, i) => {
      const fam = row[0], stack = row[1], wmin = row[2], wmax = row[3], share = row[4], occ = row[5], observationIndex = row[6];
      const sharePct = share != null ? (share/10000).toFixed(share >= 10000 ? 0 : 1) + "%" : "";
      const m = famResolve(fam);
      const resolved = m && norm(m[1]) !== norm(fam) ? m[1] : null;
      return '<button class="row" onclick="hop(\'row\',\'' + id + '|fonts|' + i + '\',\'font row ' + (i + 1) + '\')">' +
        '<span class="main"><span class="primary"><span class="font-highlight">' + esc(fam || "—") + '</span></span>' +
        (stack || resolved ? '<span class="secondary">' + (stack ? esc(stack) : "") + (stack && resolved ? " · " : "") + (resolved ? "<b>" + esc(resolved) + "</b>" : "") + '</span>' : "") + '</span>' +
        '<span class="s">' + (wmin !== wmax ? wmin + "–" + wmax : wmin) + (sharePct ? " · " + sharePct : "") + (occ ? " · " + occ + "×" : "") + '</span></button>' +
        '<div class="type-sample" style="' + escAttr(specimenCss(fam, stack, id, observationIndex) + ";font-size:15px;margin:-1px 0 8px") + '">' + specTxt() + '</div>' +
        sourceNote(fam, stack, id, observationIndex);
    });
  } else if (key === "typography") {
    body = rowsHtml(idx.typeByCap.get(id) || [], (row, i) => {
      const role = row[0], fam = row[1], w = row[2], size = row[3], lh = row[4], generic = row[7], style = row[8], tracking = row[9], occ = row[10], conf = row[12];
      const m = famResolve(fam);
      return '<button class="row" onclick="hop(\'row\',\'' + id + '|typography|' + i + '\',\'type row ' + (i + 1) + '\')"><span class="t">' + L.term("typography.role." + role, role) + " · " + (m ? L.fam(m[0], fam) : esc(fam)) + '</span><span class="s">' + (w||"") + " · " + px(size) + "</span></button>" +
        '<div class="type-sample" style="' + escAttr(specimenCss(fam) + ";font-weight:" + (w||400) + ";font-style:" + (style||"normal") + ";font-size:" + Math.min(24,Math.max(13,(size||14000)/1000)) + "px;line-height:" + (lh ? px(lh) : "1.4") + ";letter-spacing:" + (tracking ? px(tracking) : "0") ) + '">' + specTxt() + '</div><div class="font-src">' + esc([generic && generic !== "unknown" ? generic : "", style, lh ? "line " + px(lh) : "", tracking ? "tracking " + px(tracking) : "", occ ? occ + "×" : "", conf != null ? Math.round(conf/10000) + "% confidence" : ""].filter(Boolean).join(" · ")) + '</div>' +
        sourceNote(fam);
    });
  } else if (key === "text") {
    body = textStyleRows([id]);
  } else if (key === "structures") {
    body = rowsHtml(idx.structuresByCap.get(id) || [], (r, i) =>
      '<button class="row" onclick="hop(\'structure\',\'' + id + ":" + i + '\',\'' + esc(String(termLabel(r[2])).slice(0,34)) + '\')"><span class="t">' + esc(termLabel(r[2])) + '</span><span class="s">' + Math.round(r[5]/100) + "% × " + Math.round(r[6]/100) + "% · " + Math.round(r[12]/10000) + "px gap · " + Math.round(r[13]/10000) + "%</span></button>");
  } else if (key === "terms") {
    body = rowsHtml(idx.termsByCap.get(id) || [], ([tid, conf]) => {
      const note = termValueNote(id, tid);
      return '<button class="row" onclick="hop(\'term\',\'' + escId(tid) + '\',\'' + esc(String(termLabel(tid)).slice(0,34)) + '\')">' +
      '<span class="main"><span class="primary"><span class="term-highlight">' + esc(termLabel(tid)) + '</span></span>' +
      '<span class="secondary">' + esc(termFacet(tid).replace(/_/g, " ")) + (note ? " · " + note : "") + '</span></span>' +
      '<span class="s">' + (conf == null ? "—" : Math.round(conf*100) + '%') + '</span></button>' +
      (conf == null ? "" : '<div class="confbar"><i style="width:' + Math.round(conf*100) + '%"></i></div>');
    });
  } else if (key === "hist") {
    body = rowsHtml(idx.histByCap.get(id) || [], (row, i) => {
      const fid = row[0], name = row[1], sub = row[2], links = row[3];
      const m = famResolve(name);
      return '<button class="row" onclick="hop(\'row\',\'' + id + '|hist|' + i + '\',\'attribution row ' + (i + 1) + '\')"><span class="t">' + (m ? L.fam(m[0], name) : esc(name)) + (sub && sub !== name ? " · " + esc(sub) : "") + '</span><span class="s">' + links + " links</span></button>";
    });
  } else if (key === "ann") {
    body = rowsHtml(idx.annByCap.get(id) || [], ([nid, dist]) =>
      capRow(idx.cById.get(nid), Math.round((1-Math.min(1,dist))*100) + "% similar"));
  } else if (key === "sim") {
    body = rowsHtml(similarCaptures(id), ([ocid, n]) => capRow(idx.cById.get(ocid), n + " shared terms"));
  } else if (key === "samepath") {
    const pathCaps = idx.cByPath.get(cp[2]) || [];
    body = rowsHtml(pathCaps.filter(x => x[1] !== cp[1]), x => capRow(x), 60);
  } else if (key === "video") {
    body = rowsHtml(idx.videoByCap.get(id) || [], (v, i) =>
      '<button class="row" onclick="hop(\'video\',\'' + id + ":" + i + '\',\'video ' + (i+1) + '\')"><span class="t">video element ' + (i+1) + '</span><span class="s">' + Math.round(v[5]/10000) + "% coverage</span></button>");
  }
  const rawId = raw ? ++__rawSeq : 0;
  if (raw) __rawCache.set(rawId, raw);
  let count = raw ? raw.length : 0;
  if (key === "text") count = aggregateTextStyles([id]).length;
  if (key === "sim") count = similarCaptures(id).length;
  if (key === "samepath") count = (idx.cByPath.get(cp[2]) || []).filter(x => x[1] !== cp[1]).length;
  return head({ type:"section", id:c.id, label }, count) +
    '<div class="cbody">' +
    '<div class="sec"><div class="associated-capture">' + capRow(cp, "capture #" + id) + "</div></div>" +
    '<p class="prose">' + SECTION_DESC[key] + "</p>" +
    '<div class="sec"><h4>' + (key === "samepath" ? "same path" : key.replace(/_/g, " ")) + ' <span class="n">' + count + '</span></h4>' +
    (body || '<div class="empty">no data for this capture</div>') + "</div>" +
    (raw ? '<div class="sec"><h4>JSON</h4><div class="actions"><button class="action" onclick="downloadText(\'capture-' + id + '-' + key + '.json\', JSON.stringify(__rawCache.get(' + rawId + ')))">download JSON</button></div><pre class="raw">' + esc(JSON.stringify(raw, null, 2)) + "</pre></div>" : "") +
    foot(c) + "</div>";
}

async function vCaptureGradients(c, cp){
  const id = cp[0];
  const payload = await loadSimilarity("evidence:" + id, "/v1/capture-evidence", { captureId:id });
  const stops = payload.evidence?.gradient_stop || [];
  const byGradient = new Map();
  for (const row of stops) {
    const [gradientId, stopIndex] = row.identity;
    const [r,g,b,a,position] = row.values;
    pushMap(byGradient, gradientId, { stop_index:stopIndex, r, g, b, alpha_ppm:a, position_ppm:position });
  }
  const gradients = (idx.gradientsByCap.get(id) || []).map(row => ({ ...row, stops:(byGradient.get(row.gradient_id) || []).sort((a,b) => a.stop_index-b.stop_index) }));
  const bg0 = (idx.bgByCap.get(id)||[])[0];
  const seed = bg0 ? hex(bg0[0], bg0[1], bg0[2]) : null;
  return head({ type:"section", id:c.id, label:"Gradients" }, gradients.length) + '<div class="cbody">' +
    '<div class="sec"><div class="associated-capture">' + capRow(cp, "capture #" + id) + '</div></div>' +
    '<p class="prose">' + SECTION_DESC.gradients + '</p><div class="sec"><h4>gradients <span class="n">' + gradients.length + '</span></h4>' +
    (gradients.length ? rowsHtml(gradients, row => gradientRow(row, seed)) : '<div class="empty">no retained gradients for this capture</div>') + '</div>' + foot(c) + '</div>';
}

async function vCaptureEffects(c, cp){
  const id = cp[0];
  const payload = await loadSimilarity("evidence:" + id, "/v1/capture-evidence", { captureId:id });
  const evidence = payload.evidence || {};
  const completeness = new Map((evidence.completeness || []).map(row => [row.identity, row.values]));
  const status = family => {
    const row = completeness.get(family);
    if (!row || row[0] === "complete") return "";
    return '<div class="hint">coverage ' + esc(row[0].replace(/_/g," ")) + ' · retained ' + row[2] + '/' + row[1] + (row[3] ? " · " + row[3] + " truncated" : "") + (row[4] ? " · " + esc(row[4].replace(/_/g," ")) : "") + '</div>';
  };
  const borders = evidence.border || [], shadows = evidence.shadow || [], radii = evidence.radius || [], spacing = evidence.spacing || [], media = evidence.media || [];
  const borderRows = rowsHtml(borders, row => { const [,,side,width,style,r,g,b,a,occ] = row.values; return '<div class="row" style="cursor:default"><span class="sw" style="background:' + (r == null ? "transparent" : rgba(r,g,b,a)) + '"></span><span class="t">' + esc(side) + ' · ' + px(width) + ' ' + esc(style) + '</span><span class="s">' + (r == null ? "color unavailable" : hex(r,g,b)) + (occ ? " · " + occ + "×" : "") + '</span></div>'; }, 80);
  const shadowRows = rowsHtml(shadows, row => { const [,,inset,x,y,blur,spread,r,g,b,a,occ] = row.values; return '<div class="row" style="cursor:default"><span class="sw" style="background:' + (r == null ? "transparent" : rgba(r,g,b,a)) + '"></span><span class="t">' + (inset ? "inset · " : "") + px(x) + ' ' + px(y) + ' ' + px(blur) + ' ' + px(spread) + '</span><span class="s">' + (r == null ? "color unavailable" : hex(r,g,b)) + (occ ? " · " + occ + "×" : "") + '</span></div>'; }, 80);
  const radiusRows = rowsHtml(radii, row => '<div class="row" style="cursor:default"><span class="t">' + px(row.values[0]) + '</span><span class="s">' + row.values[1] + '×</span></div>', 80);
  const spacingRows = rowsHtml(spacing, row => '<div class="row" style="cursor:default"><span class="t">' + esc(row.values[0].replace(/-/g," ")) + '</span><span class="s">' + px(row.values[1]) + ' · ' + row.values[2] + '×</span></div>', 80);
  const mediaRows = rowsHtml(media, row => { const [kind,x,y,w,h,coverage,occ] = row.values; return '<div class="row" style="cursor:default"><span class="t">' + esc(kind) + ' · ' + Math.round(w/100) + '% × ' + Math.round(h/100) + '%</span><span class="s">' + Math.round(coverage/10000) + '% · ' + occ + '×</span></div>'; }, 80);
  const group = (title, rows, body, coverageFamily) => '<div class="sec"><h4>' + title + ' <span class="n">' + rows.length + '</span></h4>' + status(coverageFamily) + (body || '<div class="empty">no retained observations</div>') + '</div>';
  return head({ type:"section", id:c.id, label:"Measured effects" }, borders.length + shadows.length + radii.length + spacing.length + media.length) + '<div class="cbody">' +
    '<div class="sec"><div class="associated-capture">' + capRow(cp, "capture #" + id) + '</div></div><p class="prose">' + SECTION_DESC.effects + '</p>' +
    group("borders", borders, borderRows, "border_observation") + group("shadows", shadows, shadowRows, "shadow_observation") + group("radii", radii, radiusRows, "radius_observation") + group("spacing", spacing, spacingRows, "spacing_observation") + group("media", media, mediaRows, "media_observation") + foot(c) + '</div>';
}

async function vCaptureNeighbors(c, cp){
  const id = cp[0];
  const payload = await loadSimilarity("capture:" + id, "/v1/similar-captures", { captureId:id, limit:12 });
  const rows = payload.results || [];

  return head({ type:"section", id:c.id, label:"Visual neighbors" }, rows.length + " results") +
    '<div class="cbody">' +
    '<div class="sec"><div class="associated-capture">' + capRow(cp, "capture #" + id) + "</div></div>" +
    '<p class="prose">Nearest captures in the active screenshot embedding index. Distances are returned by the index; lower is closer.</p>' +
    '<div class="hint">' + esc(runtime.modelId || "active model") + (runtime.distance ? " · " + esc(runtime.distance) + " distance" : "") + (runtime.dimensions ? " · " + runtime.dimensions + " dimensions" : "") + '</div>' +
    '<div class="sec"><h4>visual neighbors <span class="n">' + rows.length + '</span></h4>' +
    (rows.length ? rowsHtml(rows, row => {
      const candidate = idx.cById.get(Number(row.captureId));

    foot(c) + "</div>";
}

async function vTerm(c){
  const tid = c.id;
  const caps = idx.capsByTerm.get(tid) || [];
  const payload = await loadSimilarity("term:" + tid, "/v1/term-values", { termId:tid });
  const valuesByCapture = new Map();
  for (const row of payload.rows || []) pushMap(valuesByCapture, row[0], row);
  const facetId = termFacet(tid);
  const structUses = [];
  for (const [cid, rows] of idx.structuresByCap) rows.forEach((r, i) => { if (r[2] === tid) structUses.push([cid, i]); });
  const siblings = Object.keys(D_.terms).filter(t => termFacet(t) === facetId && t !== tid).sort();
  return head(c, caps.length + " captures") +
    '<div class="cbody">' +

const lb = document.createElement("div");

  '<div class="lb-cap"><span class="lb-title"></span><span class="lb-sub"></span></div>';
document.body.appendChild(lb);
let lbIds = [], lbIdx = 0, lbOpen = false;
const lbEl = { stage: lb.querySelector(".lb-stage"), img: lb.querySelector(".lb-img"), vid: lb.querySelector(".lb-video"), close: lb.querySelector(".lb-close"), prev: lb.querySelector(".lb-prev"), next: lb.querySelector(".lb-next"), cap: lb.querySelector(".lb-cap"), title: lb.querySelector(".lb-title"), sub: lb.querySelector(".lb-sub"), count: lb.querySelector(".lb-count") };
function lbCollect(el){
  const root = el.closest(".col") || document;
  lbIds = [...new Set([...root.querySelectorAll("[data-capture]")].map(node => String(node.dataset.capture)))];
}
function lbFinalRect(id, arOverride){
  const m = idx.motionByCap.get(Number(id));
  const ar = arOverride || (m ? Math.max(0.3, m[5] / m[6]) : 1.6);
  const maxW = Math.min(innerWidth * 0.9, 1280), maxH = innerHeight * 0.82;
  let w = maxW, h = w / ar;
  if (h > maxH){ h = maxH; w = h * ar; }
  return { x: (innerWidth - w) / 2, y: (innerHeight - h) / 2, w, h };
}
function lbApplyRect(r){ const s = lbEl.stage.style; s.left = r.x + "px"; s.top = r.y + "px"; s.width = r.w + "px"; s.height = r.h + "px"; }
function lbLoad(id){
  const cp = idx.cById.get(Number(id));
  const m = idx.motionByCap.get(Number(id));
  const img = lbEl.img, vid = lbEl.vid;
  img.classList.remove("on"); img.removeAttribute("src");
  vid.classList.remove("on"); vid.pause(); vid.removeAttribute("src"); vid.load();
  if (m) {
    vid.poster = cp ? cp[5] : "";
    vid.src = m[1];
    img.src = cp ? cp[5] : "";
    vid.onloadedmetadata = () => {
      if (vid.classList.contains("on") && vid.videoWidth && vid.videoHeight) {
        lbApplyRect(lbFinalRect(id, vid.videoWidth / vid.videoHeight));
      }
    };
    vid.classList.add("on");
    vid.play().catch(() => {});
  } else {
    img.onload = () => {
      if (!img.classList.contains("on")) return;
      const ar = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 1.6;
      lbApplyRect(lbFinalRect(id, ar));
    };
    img.src = cp ? cp[5] : "";
    img.classList.add("on");
  }
  lbEl.title.textContent = cp ? cp[3] : "capture " + id;
  lbEl.sub.textContent = cp ? cp[1].replace("https://","") + (cp[2] && cp[2] !== "/" ? " · " + cp[2] : "") + " · " + fmtDate(cp[4]) : "";
  lbEl.count.textContent = (lbIdx + 1) + " / " + lbIds.length;
}
function openLightbox(el, id){
  if (!idx.cById.has(Number(id))) return;
  lbCollect(el);
  lbIdx = lbIds.indexOf(String(id)); if (lbIdx < 0){ lbIds.unshift(String(id)); lbIdx = 0; }
  lb.classList.add("on");
  const r = el.getBoundingClientRect();
  const f = lbFinalRect(id);
  const s = lbEl.stage;
  s.style.transition = "none";
  lbApplyRect(f);
  const dx = r.left - f.x + (r.width - f.w) / 2, dy = r.top - f.y + (r.height - f.h) / 2;
  const sx = r.width / f.w, sy = r.height / f.h;
  s.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")";
  s.style.opacity = "0";
  lb.classList.add("lb-morph");
  s.offsetWidth;
  s.style.transition = "";
  s.style.transform = "none";
  s.style.opacity = "1";
  setTimeout(() => lb.classList.remove("lb-morph"), 360);
  lbLoad(id);
  lbOpen = true;
}
function lbNav(d){
  if (!lbIds.length) return;
  lbIdx = (lbIdx + d + lbIds.length) % lbIds.length;
  const id = lbIds[lbIdx];
  lbEl.stage.style.opacity = "0";
  setTimeout(() => {
    lbApplyRect(lbFinalRect(id));
    lbLoad(id);
    lbEl.stage.style.opacity = "1";
  }, 170);
}
function lbClose(){
  if (!lbOpen) return;
  lbOpen = false;
  const s = lbEl.stage;
  s.style.opacity = "0";
  setTimeout(() => { if (!lbOpen) lb.classList.remove("on"); }, 200);
  lbEl.vid.pause();
}
lbEl.close.addEventListener("click", lbClose);

  if (!lbOpen) return;
  if (e.key === "Escape"){ e.stopPropagation(); lbClose(); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); lbNav(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); lbNav(1); }
});

const qEl = document.getElementById("q");
const resultsEl = document.getElementById("results");
let hlIdx = 0, hlFns = [];
function doSearch(){
  const s = qEl.value.trim().toLowerCase();
  if (!s){ resultsEl.classList.remove("on"); resultsEl.innerHTML = ""; return; }
  const groups = [];
  const doms = [...idx.cByDomain.keys()].filter(o => o.includes(s)).slice(0,6);
  const caps = D_.captures.filter(cp => cp[3].toLowerCase().includes(s) || cp[1].includes(s)).slice(0,6);
  const fams = D_.families.filter(f => f[1].toLowerCase().includes(s)).slice(0,6);
  const terms = Object.keys(D_.terms).filter(t => termLabel(t).toLowerCase().includes(s) || t.includes(s)).slice(0,6);
  const facets = [...new Set(Object.values(D_.terms).map(t => t[2]))].filter(f => f.includes(s) || f.replace(/_/g," ").includes(s)).slice(0,6);
  const paths = [...idx.cByPath.keys()].filter(p => p.includes(s)).slice(0,4);
  if (doms.length) groups.push({ g:"domains", items: doms.map(o => ({ origin:o, t:o.replace("https://",""), s:(idx.cByDomain.get(o)||[]).length + " captures", c:"var(--entity-domain)", fn:() => fresh("domain", o, o.replace("https://","")) })) });
  if (caps.length) groups.push({ g:"captures", items: caps.map(cp => ({ t:cp[3], s:cp[1].replace("https://","") + " · " + fmtDate(cp[4]), c:"var(--entity-capture)", fn:() => fresh("capture", cp[0], cp[3].slice(0,40)) })) });
  if (fams.length) groups.push({ g:"font families", items: fams.map(f => ({ t:f[1], s:"#" + f[0], c:"var(--entity-family)", fn:() => fresh("family", f[0], f[1].slice(0,40)) })) });
  if (terms.length) groups.push({ g:"terms", items: terms.map(t => ({ t:termLabel(t), s:termFacet(t), c:"var(--entity-term)", fn:() => fresh("term", t, String(termLabel(t)).slice(0,40)) })) });
  if (facets.length) groups.push({ g:"facets", items: facets.map(f => ({ t:f.replace(/_/g," "), s:"facet", c:"var(--entity-facet)", fn:() => fresh("facet", f, f) })) });
  if (paths.length) groups.push({ g:"paths", items: paths.map(p => ({ t:p||"/", s:(idx.cByPath.get(p)||[]).length + " captures", c:"var(--entity-neutral)", fn:() => fresh("browse", "path", p) })) });
  const designers = D_.designers.filter(x => x[1].toLowerCase().includes(s)).slice(0,5);
  if (designers.length) groups.push({ g:"designers", items: designers.map(x => ({ t:x[1], s:"designer", c:"var(--entity-designer)", fn:() => fresh("designer", x[0], x[1].slice(0,40)) })) });
  const vendors = D_.vendors.filter(x => x[1].toLowerCase().includes(s)).slice(0,5);
  if (vendors.length) groups.push({ g:"foundries", items: vendors.map(x => ({ t:x[1], s:"vendor", c:"var(--entity-designer)", fn:() => fresh("vendor", x[0], x[1].slice(0,40)) })) });
  const rels2 = relations.filter(r => r.name.toLowerCase().includes(s)).slice(0,6);
  if (rels2.length) groups.push({ g:"relations", items: rels2.map(r => ({ t:r.name, s:(r.keys||0) + "+" + (r.nonkeys||0), c:"var(--entity-neutral)", fn:() => fresh("relation", r.name, r.name.slice(0,40)) })) });
  const lookups = Object.keys(D_.font_similarity_results || {}).filter(n => n.toLowerCase().includes(s)).slice(0,5);
  if (lookups.length) groups.push({ g:"similarity lookups", items: lookups.map(n => ({ t:n, s:(D_.font_similarity_results[n]||[]).length + " results", c:"var(--entity-family)", fn:() => fresh("fontLookup", n, n.slice(0,40)) })) });
  const systems = [];
  if (s.includes("motion") || s.includes("webm")) systems.push({ t:"Recorded motion", s:"all WebM captures", c:"var(--entity-motion)", fn:() => fresh("browse", "motion", "motion") });
  if (s.includes("video") || s.includes("media")) systems.push({ t:"Page video", s:"video-bearing captures", c:"var(--entity-video)", fn:() => fresh("browse", "video", "video") });
  if (s.includes("font") && s.includes("similar")) systems.push({ t:"Font similarity", s:"descriptor engine", c:"var(--entity-family)", fn:() => fresh("fontSim", "font-similarity", "Font similarity") });
  if (s.includes("embedding") || s.includes("similar capture")) systems.push({ t:"Embeddings", s:"visual similarity index", c:"var(--entity-color)", fn:() => fresh("embeddings", "embeddings", "Embeddings") });
  if (s.includes("schema") || s.includes("relation")) systems.push({ t:"Schema", s:"all relations", c:"var(--entity-neutral)", fn:() => fresh("relations", "relations", "Schema") });
  if (systems.length) groups.push({ g:"systems", items: systems });
  resultsEl.innerHTML = groups.map(g =>
    '<div class="rg">' + g.g + "</div>" + g.items.map(it => '<button class="res">' + (it.origin ? favicon(it.origin, true) : '<span class="sdot" style="background:' + it.c + '"></span>') + '<span class="t">' + esc(it.t) + '</span><span class="s">' + esc(it.s) + "</span></button>").join("")
  ).join("") || '<div class="rg">no matches</div>';
  resultsEl.classList.add("on");

  document.querySelectorAll("#results .res").forEach((el, i) => el.classList.toggle("hl", i === 0));
}
function moveHl(d){

});
function restoreRoute(){
  if (suppressHash) return;
  if (!openHash(location.hash)) setColumns([homeColumn()], { historyMode:"replace" });
}
window.addEventListener("hashchange", restoreRoute);
window.addEventListener("popstate", restoreRoute);

/* ---------- boot ---------- */

const suppliedConfig = window.FUDGE_EXPLORER_CONFIG || {};
const explorerConfig = Object.assign({ endpoint:"/v1/query", request:{} }, suppliedConfig);
let loadController;
async function requestServiceJson(url, signal){
  const headers = new Headers(explorerConfig.request.headers);
  const request = Object.assign({}, explorerConfig.request, { signal, headers });
  const response = await fetch(url, request);
  if (!response.ok) throw new Error(response.status + " " + response.statusText + " · " + url);
  return response.json();
}
function similarityUrl(path, parameters){
  const url = new URL(explorerConfig.endpoint, location.href);
  url.pathname = path;
  url.search = "";
  for (const [key, value] of Object.entries(parameters)) url.searchParams.set(key, value);
  url.searchParams.set("generation", D_.observed_generation);
  return url.href;
}
function loadSimilarity(cacheKey, path, parameters){
  const key = D_.observed_generation + ":" + cacheKey;
  if (!similarityCache.has(key)) {
    const load = requestServiceJson(similarityUrl(path, parameters)).catch(error => {
      similarityCache.delete(key);
      throw error;
    });
    similarityCache.set(key, load);
  }
  return similarityCache.get(key);
}
function normalizeBundle(payload){
  const data = payload.data || payload.snapshot || payload;
  return {
    data,
    gradients: payload.gradients ?? data.gradients ?? {},
    fontSources: payload.fontSources ?? payload.font_sources ?? data.font_sources ?? {},
    relations: payload.relations ?? data.relations ?? [],
    legacyColors: payload.legacyColors ?? payload.legacy_colors ?? data.legacy_colors ?? {}
  };
}
const dataSource = {
  kind:"service",
  async load({ signal }){ return requestServiceJson(explorerConfig.endpoint, signal); }
};
function installBundle(bundle){
  const { data:d, gradients:g, fontSources:fs, relations:rels, legacyColors } = bundle;
  resultsEl.classList.remove("on"); resultsEl.innerHTML = ""; qEl.value = ""; hlFns = []; moreRows.clear(); similarityCache.clear();
  clearTimeout(hvTimer); hvEl.classList.remove("open"); lbClose(); lbIds = [];
  D_ = Object.assign({}, d, { gradients:g, legacy_colors:legacyColors });
  relations = rels;
  bundleGeneration++;
  buildIndexes();
  initFontSources(fs);
  const legacyColorCount = Object.values(legacyColors).reduce((sum, rows) => sum + rows.length, 0);
  const metaEl = document.getElementById("meta");
  metaEl.textContent = d.captures.length.toLocaleString() + " captures · " + d.domains.length.toLocaleString() + " domains";
  metaEl.title =
    d.domains.length.toLocaleString() + " domains · " + d.captures.length.toLocaleString() + " captures · " +
    d.families.length.toLocaleString() + " families · " + Object.keys(d.terms).length + " terms · " +
    d.color_roles.length.toLocaleString() + " measured colors · " + legacyColorCount.toLocaleString() + " legacy palette colors · " + d.font_obs.length.toLocaleString() + " font observations · " + (d.ann?Object.keys(d.ann).length:0) + " ANN pivots · " + (d.motion_assets||[]).length.toLocaleString() + " motion · " + (d.font_similarity_results?Object.keys(d.font_similarity_results).length:0) + " font-sim" +
    (d.text_styles ? " · " + d.text_styles.length.toLocaleString() + " text styles" : "") +
    (d.hist_fonts ? " · " + d.hist_fonts.length.toLocaleString() + " legacy attributions" : "") +
    (Object.keys(g).length ? " · " + Object.keys(g).length + " gradient captures" : "") +
    (Object.keys(fs).length ? " · " + fontSrc.faces + " font preview faces" : "") +
    (rels.length ? " · " + rels.length + " relations" : "");
  if (!openHash(location.hash, true)) setColumns([homeColumn()], { historyMode:"replace" });
}
async function reload(){
  if (loadController) loadController.abort();
  const controller = loadController = new AbortController();
  document.getElementById("meta").textContent = "loading…";
  try {
    const bundle = await dataSource.load({ signal:controller.signal });
    if (controller !== loadController || controller.signal.aborted) return;
    installBundle(normalizeBundle(bundle));
  } catch (error) {
    if (controller !== loadController || controller.signal.aborted || error.name === "AbortError") return;
    disposeFontSources();
    document.getElementById("meta").textContent = "load failed";
    colsEl.innerHTML = '<div class="col"><div class="cbody"><div class="empty">Failed to load explorer data.<br>' + esc(String(error)) + "</div></div></div>";
  }
}
window.FudgeExplorer = {
  reload,
  configure(options = {}){
    Object.assign(explorerConfig, options);
    return reload();
  }
};
reload();
</script>
</body>
