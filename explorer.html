<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:,">
<title>Fudge — Explorer</title>
<link rel="preload" href="pt-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family:"PT Serif";
  font-style:normal;
  font-display:swap;
  font-weight:400;
  src:url("pt-serif-latin-400-normal.woff2") format("woff2");
}
#app-splash {
  position:fixed;
  inset:0;
  z-index:2147483647;
  display:grid;
  place-items:center;
  background:#0b0b0b;
  color:#fff;
  opacity:1;
  transition:opacity 320ms cubic-bezier(.3,0,1,1);
}
#app-splash.app-splash--dismissing { pointer-events:none; opacity:0; }
#app-splash-content { display:flex; flex-direction:column; align-items:center; }
#app-splash-wordmark {
  font-family:"PT Serif",Georgia,serif;
  font-size:clamp(2.25rem,8vw,4rem);
  line-height:1;
  letter-spacing:-.04em;
}
#app-splash-dot { color:#f7552b; }
#app-splash-progress {
  width:min(240px,58vw);
  height:2px;
  margin-top:28px;
  overflow:hidden;
  background:rgba(255,255,255,.18);
}
#app-splash-progress-fill {
  display:block;
  width:0;
  height:100%;
  background:#f7552b;
  transition:width 180ms linear;
}
#app-splash-progress-value {
  margin-top:9px;
  color:rgba(255,255,255,.56);
  font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums;
}
@media (prefers-reduced-motion:reduce) {
  #app-splash { transition-duration:1ms; }
  #app-splash-progress-fill { transition:none; }
}
</style>
<link rel="stylesheet" href="explorer.css">
<script src="theme-registry.js"></script>
</head>
<body>
<div id="app-splash" role="progressbar" aria-label="Loading Explorer" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div id="app-splash-content">
    <span id="app-splash-wordmark" aria-hidden="true">Fudge<span id="app-splash-dot">.</span></span>
    <span id="app-splash-progress" aria-hidden="true"><i id="app-splash-progress-fill"></i></span>
    <span id="app-splash-progress-value" aria-hidden="true">0%</span>
  </div>
</div>
<explorer-app></explorer-app>
<script type="module" src="explorer.js"></script>
</body>
</html>
